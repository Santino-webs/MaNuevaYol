<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Siete días de inglés de supervivencia para manejarte solo en Nueva York.">
<meta name="theme-color" content="#0b0d10">
<title>Ma Nueva Yol · Inglés de calle en 7 días</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700..800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================================
   MA NUEVA YOL — sistema visual
   Referencia: señalética del subte de Nueva York, pero contemporánea:
   discos de línea, alto contraste y bordes rectos, con tipografía enorme.
   TODOS los colores se declaran acá en :root y se redefinen en el media
   query oscuro. Ninguno vive solamente adentro del media query.
   ========================================================================= */
:root{
  color-scheme: light dark;

  /* --- Superficies e tinta --- */
  --fondo:        #eef0f3;
  --fondo-2:      #e2e6eb;
  --panel:        #ffffff;
  --panel-2:      #e7eaee;
  --panel-3:      #d8dde3;
  --barra:        #0b0d10;
  --barra-tinta:  #ffffff;

  --tinta:        #0b0d10;
  --tinta-2:      #454c56;
  --tinta-3:      #636a74;
  --tinta-inv:    #ffffff;

  --borde:        #0b0d10;
  --borde-suave:  #ccd2d9;
  --riel:         #d3d8de;
  --foco:         #0039a6;
  --foco-halo:    #ffffff;
  --velo:         rgba(11,13,16,.62);
  --sombra:       0 3px 0 0 var(--borde);
  --sombra-alta:  0 5px 0 0 var(--borde);

  /* --- Las 7 líneas. Cada día tiene tres roles:
         --diaN      color bandera (discos, rieles, fondos plenos)
         --diaN-tinta texto que va ARRIBA del color bandera
         --diaN-txt  versión legible del color como TEXTO sobre panel
         Los hex cambian por tema: no se reusan los mismos. --- */
  --dia1:       #f5c400;  --dia1-tinta:#0b0d10;  --dia1-txt:#7a5c00;
  --dia2:       #008034;  --dia2-tinta:#ffffff;  --dia2-txt:#006b2c;
  --dia3:       #0039a6;  --dia3-tinta:#ffffff;  --dia3-txt:#0039a6;
  --dia4:       #c44403;  --dia4-tinta:#ffffff;  --dia4-txt:#a83b00;
  --dia5:       #a0209e;  --dia5-tinta:#ffffff;  --dia5-txt:#8a1a88;
  --dia6:       #007d8a;  --dia6-tinta:#ffffff;  --dia6-txt:#00616b;
  --dia7:       #e0271f;  --dia7-tinta:#ffffff;  --dia7-txt:#b81c16;

  /* Acento activo: cada pantalla lo reapunta al color de su día */
  --acento:       var(--dia3);
  --acento-tinta: var(--dia3-tinta);
  --acento-txt:   var(--dia3-txt);
  --acento-trazo: var(--dia3-txt);

  /* --- Semánticos --- */
  --ok:         #00701f;  --ok-fondo:#d8f0dd;  --ok-borde:#00701f;
  --mal:        #b2211c;  --mal-fondo:#fbdedc;  --mal-borde:#b2211c;
  --aviso:      #8a4b00;  --aviso-fondo:#ffeccd; --aviso-borde:#8a4b00;
  --sos:        #d31f1a;  --sos-tinta:#ffffff;

  /* --- Tipografía --- */
  --f-display: "Archivo", "Archivo Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-texto:   "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --t-xs: .75rem;    /* 12 */
  --t-s:  .875rem;   /* 14 */
  --t-m:  1rem;      /* 16 */
  --t-l:  1.1875rem; /* 19 */
  --t-xl: 1.5rem;    /* 24 */
  --t-2xl:1.9375rem; /* 31 */
  --t-3xl:clamp(2.25rem, 10.5vw, 3.5rem);

  /* --- Métricas --- */
  --toque: 44px;
  --r:     3px;      /* bordes rectos, apenas suavizados */
  --r-g:   6px;
  --ancho: 34rem;
  --disco: 46px;
}

@media (prefers-color-scheme: dark){
  :root{
    --fondo:        #0c0e11;
    --fondo-2:      #131619;
    --panel:        #171a1f;
    --panel-2:      #21252b;
    --panel-3:      #2c3138;
    --barra:        #000000;
    --barra-tinta:  #ffffff;

    --tinta:        #f2f4f7;
    --tinta-2:      #c2c9d2;
    --tinta-3:      #939aa4;
    --tinta-inv:    #0b0d10;

    --borde:        #59616c;
    --borde-suave:  #343a42;
    --riel:         #2b3038;
    --foco:         #8ab4ff;
    --foco-halo:    #000000;
    --velo:         rgba(0,0,0,.74);
    --sombra:       0 3px 0 0 #000000;
    --sombra-alta:  0 5px 0 0 #000000;

    --dia1:       #ffd23f;  --dia1-tinta:#0b0d10;  --dia1-txt:#ffd23f;
    --dia2:       #2fbf5f;  --dia2-tinta:#03200e;  --dia2-txt:#54d97f;
    --dia3:       #4d8dff;  --dia3-tinta:#04122e;  --dia3-txt:#7fb0ff;
    --dia4:       #ff7a29;  --dia4-tinta:#1d0800;  --dia4-txt:#ff9a56;
    --dia5:       #d95fd6;  --dia5-tinta:#240622;  --dia5-txt:#e98ae6;
    --dia6:       #2fc2d1;  --dia6-tinta:#042126;  --dia6-txt:#5bd6e2;
    --dia7:       #ff5348;  --dia7-tinta:#200402;  --dia7-txt:#ff8079;

    --acento:       var(--dia3);
    --acento-tinta: var(--dia3-tinta);
    --acento-txt:   var(--dia3-txt);
    --acento-trazo: var(--dia3-txt);

    --ok:         #5fd98a;  --ok-fondo:#0f2e1b;  --ok-borde:#2f9c56;
    --mal:        #ff8a84;  --mal-fondo:#36110f;  --mal-borde:#c0413b;
    --aviso:      #ffc06b;  --aviso-fondo:#33240e; --aviso-borde:#8a6520;
    --sos:        #d92e27;  --sos-tinta:#ffffff;
  }
}

/* Cada día reapunta el acento. Una sola clase por día. */
.d1{ --acento:var(--dia1); --acento-tinta:var(--dia1-tinta); --acento-txt:var(--dia1-txt); --acento-trazo:var(--dia1-txt); }
.d2{ --acento:var(--dia2); --acento-tinta:var(--dia2-tinta); --acento-txt:var(--dia2-txt); --acento-trazo:var(--dia2-txt); }
.d3{ --acento:var(--dia3); --acento-tinta:var(--dia3-tinta); --acento-txt:var(--dia3-txt); --acento-trazo:var(--dia3-txt); }
.d4{ --acento:var(--dia4); --acento-tinta:var(--dia4-tinta); --acento-txt:var(--dia4-txt); --acento-trazo:var(--dia4-txt); }
.d5{ --acento:var(--dia5); --acento-tinta:var(--dia5-tinta); --acento-txt:var(--dia5-txt); --acento-trazo:var(--dia5-txt); }
.d6{ --acento:var(--dia6); --acento-tinta:var(--dia6-tinta); --acento-txt:var(--dia6-txt); --acento-trazo:var(--dia6-txt); }
.d7{ --acento:var(--dia7); --acento-tinta:var(--dia7-tinta); --acento-txt:var(--dia7-txt); --acento-trazo:var(--dia7-txt); }

/* ============================================================================
   BASE
   ========================================================================= */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--fondo); color:var(--tinta);
  font-family:var(--f-texto); font-size:var(--t-m); line-height:1.5;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
img,svg{ max-width:100%; }
[hidden]{ display:none !important; }
:focus{ outline:none; }
:focus-visible{ outline:3px solid var(--foco); outline-offset:3px; box-shadow:0 0 0 2px var(--foco-halo); }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}

h1,h2,h3{ font-family:var(--f-display); font-weight:800; letter-spacing:-.02em; line-height:1.04; margin:0 0 .5rem; }
h2{ font-size:var(--t-2xl); }
h3{ font-size:var(--t-xl); }
p{ margin:0 0 .75rem; }
strong{ font-weight:600; }
.apagado{ color:var(--tinta-2); }
.kicker{
  font-family:var(--f-mono); font-size:var(--t-xs); font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; color:var(--tinta-3); margin:0 0 .5rem;
}
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ============================================================================
   ESTRUCTURA
   ========================================================================= */
#app{ display:flex; flex-direction:column; min-height:100vh; }
.barra{
  position:sticky; top:0; z-index:40;
  background:var(--barra); color:var(--barra-tinta);
  border-bottom:4px solid var(--acento);
  padding-top:env(safe-area-inset-top);
}
.barra-int{
  max-width:var(--ancho); margin:0 auto;
  display:flex; align-items:center; gap:.5rem; padding:.4rem .75rem;
}
.marca{
  font-family:var(--f-display); font-weight:800; font-size:.9375rem; letter-spacing:.02em;
  text-transform:uppercase; margin:0; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.barra-btn{
  min-width:var(--toque); min-height:var(--toque);
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:transparent; color:var(--barra-tinta);
  border:2px solid currentColor; border-radius:var(--r);
  font:inherit; font-size:var(--t-s); font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; cursor:pointer; padding:0 .625rem;
}
.barra-btn:hover{ background:var(--barra-tinta); color:var(--barra); }
.barra-btn.sos{ background:var(--sos); color:var(--sos-tinta); border-color:var(--sos); }
.barra-btn.sos:hover{ filter:brightness(1.15); }

main{ flex:1; width:100%; max-width:var(--ancho); margin:0 auto; padding:1.25rem 1rem 6.5rem; }
.vista[hidden]{ display:none !important; }

.pie{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--barra); border-top:4px solid var(--acento);
  padding:.4rem .75rem; padding-bottom:calc(.4rem + env(safe-area-inset-bottom));
}
.pie-int{ max-width:var(--ancho); margin:0 auto; display:flex; gap:.5rem; }
.pie .btn{ flex:1; }

/* ============================================================================
   DISCOS DE LÍNEA
   ========================================================================= */
.disco{
  width:var(--disco); height:var(--disco); flex:0 0 var(--disco);
  border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--f-display); font-weight:800; font-size:1.25rem; line-height:1;
  background:var(--acento); color:var(--acento-tinta);
  font-variant-numeric:tabular-nums;
}
.disco.chico{ --disco:30px; font-size:.875rem; }
.disco.grande{ --disco:64px; font-size:1.75rem; }

/* ============================================================================
   BOTONES
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  min-height:var(--toque); padding:.625rem 1rem;
  font:inherit; font-weight:600; letter-spacing:.01em;
  background:var(--panel); color:var(--tinta);
  border:2px solid var(--borde); border-radius:var(--r); cursor:pointer;
  transition:transform .1s ease, background .15s ease;
}
.btn:hover{ background:var(--panel-2); }
.btn:active{ transform:translateY(2px); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.primario{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }
.btn.primario:hover{ filter:brightness(1.08); background:var(--acento); }
.btn.sos{ background:var(--sos); color:var(--sos-tinta); border-color:var(--sos); }
.btn.bloque{ width:100%; }
.btn.grande{
  width:100%; min-height:3.75rem; font-family:var(--f-display); font-weight:800;
  font-size:var(--t-l); text-transform:uppercase; letter-spacing:.01em;
  box-shadow:var(--sombra-alta);
}
.fila-btns{ display:flex; gap:.625rem; flex-wrap:wrap; }
.fila-btns .btn{ flex:1 1 8.75rem; }
.ico{ flex:0 0 auto; }

/* ============================================================================
   LÍNEA DE PROGRESO — 7 estaciones. Vertical en el celular,
   horizontal en escritorio. Es la pieza central del inicio.
   ========================================================================= */
.linea{ position:relative; margin:0 0 1.5rem; }
.estacion{
  position:relative; display:flex; align-items:center; gap:.875rem;
  width:100%; min-height:4.25rem; padding:.375rem .5rem .375rem 0;
  background:none; border:0; border-radius:var(--r);
  font:inherit; color:inherit; text-align:left; cursor:pointer;
}
.estacion::before{           /* segmento de riel detrás del disco */
  content:""; position:absolute; left:calc(var(--disco)/2 - 3px);
  top:0; bottom:0; width:6px; background:var(--riel);
}
.estacion:first-child::before{ top:50%; }
.estacion:last-child::before{ bottom:50%; }
.estacion.hecha::before{ background:var(--acento-trazo); }
.estacion > *{ position:relative; z-index:1; }
.estacion:hover .et{ text-decoration:underline; text-underline-offset:3px; }

.estacion .disco{
  border:4px solid var(--fondo);
  box-shadow:0 0 0 3px var(--acento-trazo);
}
.estacion.futura .disco{
  background:var(--fondo); color:var(--tinta-3);
  box-shadow:0 0 0 3px var(--riel);
}
.estacion.actual .disco{ position:relative; }
.estacion.actual .disco::after{     /* anillo que late, sin color-mix */
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:3px solid var(--acento-trazo); animation:latido 2.4s ease-out infinite;
}
@keyframes latido{ 0%{ transform:scale(1); opacity:.9; } 70%,100%{ transform:scale(1.6); opacity:0; } }
.estacion .txt{ flex:1; min-width:0; }
.estacion .et{ display:block; font-family:var(--f-display); font-weight:800; font-size:var(--t-l); line-height:1.1; }
.estacion .sub{ display:block; font-size:var(--t-s); color:var(--tinta-2); margin-top:.125rem; }
.estacion .marca-est{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:.3rem;
  font-family:var(--f-mono); font-size:var(--t-xs); font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--acento-txt);
}
.estacion.futura .marca-est{ color:var(--tinta-3); }

@media (min-width:56rem){
  :root{ --ancho:52rem; }
  .linea{ display:flex; gap:0; }
  .estacion{ flex:1; flex-direction:column; text-align:center; gap:.5rem; padding:.5rem .25rem; min-height:0; }
  .estacion::before{ left:0; right:0; top:calc(var(--disco)/2 - 3px); bottom:auto; width:auto; height:6px; }
  .estacion:first-child::before{ top:calc(var(--disco)/2 - 3px); left:50%; }
  .estacion:last-child::before{ bottom:auto; right:50%; left:0; }
  .estacion .et{ font-size:var(--t-s); }
  .estacion .sub{ display:none; }
}

/* Tren en miniatura que avanza a la estación siguiente (fin de día) */
.mini-linea{ position:relative; display:flex; align-items:center; margin:1.25rem 0; height:3rem; }
.mini-linea .riel-mini{ position:absolute; left:0; right:0; top:calc(50% - 3px); height:6px; background:var(--riel); }
.mini-linea .riel-hecho{ position:absolute; left:0; top:calc(50% - 3px); height:6px; background:var(--acento-trazo); }
.mini-linea .punto{
  position:relative; flex:1; display:flex; justify-content:center;
}
.mini-linea .punto i{
  display:block; width:14px; height:14px; border-radius:50%;
  background:var(--riel); border:3px solid var(--fondo);
}
.mini-linea .punto.hecho i{ background:var(--acento-trazo); }
.tren{
  position:absolute; top:calc(50% - 15px); z-index:2;
  animation:viaja 1.5s cubic-bezier(.6,.05,.25,1) forwards;
}
@keyframes viaja{ from{ left:var(--desde); } to{ left:var(--hasta); } }

/* ============================================================================
   TARJETAS
   ========================================================================= */
.panel{
  background:var(--panel); border:2px solid var(--borde-suave);
  border-radius:var(--r-g); padding:1rem; margin:0 0 .875rem;
}
.panel.marcado{ border:2px solid var(--borde); border-left:8px solid var(--acento); }

.metricas{ display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin:0 0 1.25rem; }
.metrica{
  background:var(--panel); border:2px solid var(--borde-suave); border-radius:var(--r-g);
  padding:.75rem .5rem; text-align:center; min-width:0;
}
.metrica .n{ font-family:var(--f-display); font-weight:800; font-size:var(--t-2xl); line-height:1; font-variant-numeric:tabular-nums; }
.metrica .r{ font-family:var(--f-mono); font-size:.6875rem; text-transform:uppercase; letter-spacing:.1em; color:var(--tinta-2); margin-top:.375rem; }

/* --- La frase como pieza central --- */
.tarjeta-frase{
  background:var(--panel); border:2px solid var(--borde);
  border-top:10px solid var(--acento);
  border-radius:var(--r-g); padding:1.25rem 1rem 1.125rem; margin:0 0 1rem;
}
.frase-en{
  font-family:var(--f-display); font-weight:800; font-size:var(--t-3xl); line-height:1.02;
  letter-spacing:-.03em; margin:0 0 .75rem; overflow-wrap:break-word; hyphens:none;
}
.frase-pron{
  font-family:var(--f-mono); font-size:var(--t-m); font-weight:600;
  color:var(--acento-txt); margin:0 0 .875rem; overflow-wrap:break-word;
}
.frase-es{ font-size:var(--t-l); font-weight:500; margin:0 0 .875rem; }
.frase-uso{
  font-size:var(--t-s); color:var(--tinta-2); line-height:1.55;
  border-top:2px solid var(--borde-suave); padding-top:.75rem; margin:0;
}
.entra-der{ animation:desliza-der .24s cubic-bezier(.22,.61,.36,1) both; }
.entra-izq{ animation:desliza-izq .24s cubic-bezier(.22,.61,.36,1) both; }
@keyframes desliza-der{ from{ opacity:0; transform:translateX(22px); } to{ opacity:1; transform:none; } }
@keyframes desliza-izq{ from{ opacity:0; transform:translateX(-22px); } to{ opacity:1; transform:none; } }

/* ============================================================================
   ETAPAS
   ========================================================================= */
.pasos{ display:flex; gap:.375rem; margin:0 0 1rem; }
.paso{
  flex:1; text-align:center; font-family:var(--f-mono); font-size:.6875rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.08em;
  padding:.5rem .25rem; border:2px solid var(--borde-suave); border-radius:var(--r);
  background:var(--panel); color:var(--tinta-3);
  display:flex; align-items:center; justify-content:center; gap:.25rem;
}
.paso[aria-current="step"]{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }
.paso.hecho{ color:var(--ok); border-color:var(--ok-borde); }
.contador{
  font-family:var(--f-mono); font-size:var(--t-xs); font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-3); margin:0 0 .5rem;
}

/* ============================================================================
   AUDIO
   ========================================================================= */
.audio-fila{ display:flex; gap:.5rem; flex-wrap:wrap; margin:0 0 .875rem; }
.btn-audio{
  min-height:var(--toque); min-width:var(--toque);
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  padding:0 .875rem; font:inherit; font-size:var(--t-s); font-weight:600;
  background:var(--panel-2); color:var(--tinta);
  border:2px solid var(--borde); border-radius:var(--r); cursor:pointer;
}
.btn-audio:hover{ background:var(--panel-3); }
.btn-audio[aria-pressed="true"]{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }

/* ============================================================================
   EJERCICIOS
   ========================================================================= */
.opciones{ display:grid; gap:.5rem; margin:0 0 .875rem; }
.opcion{
  display:flex; align-items:center; gap:.75rem; width:100%;
  min-height:var(--toque); padding:.75rem .875rem;
  font:inherit; font-size:var(--t-m); text-align:left;
  background:var(--panel); color:var(--tinta);
  border:2px solid var(--borde); border-radius:var(--r); cursor:pointer;
}
.opcion:hover:not([disabled]){ background:var(--panel-2); }
.opcion[disabled]{ cursor:default; }
.opcion .letra{
  flex:0 0 1.75rem; height:1.75rem; display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-weight:600; font-size:var(--t-s);
  border:2px solid var(--borde-suave); border-radius:var(--r);
}
.opcion .cuerpo{ flex:1; min-width:0; }
.opcion .cuerpo small{ display:block; color:var(--tinta-2); font-size:var(--t-s); margin-top:.125rem; }
.opcion.ok{ background:var(--ok-fondo); border-color:var(--ok-borde); }
.opcion.ok .letra{ background:var(--ok-borde); color:#fff; border-color:var(--ok-borde); }
.opcion.mal{ background:var(--mal-fondo); border-color:var(--mal-borde); animation:temblor .32s ease; }
.opcion.mal .letra{ background:var(--mal-borde); color:#fff; border-color:var(--mal-borde); }

const $ = (id) => document.getElementById(id);
const AVISOS = $("avisos");
function avisar(t){ if(AVISOS){ AVISOS.textContent=""; setTimeout(()=>{ AVISOS.textContent=t; },30); } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizar(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function idFrase(f){ return normalizar(f.en).replace(/ /g,"-"); }
function mezclar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function hoyISO(d){ const x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function diasEntre(a,b){
  const pa=String(a).split("-").map(Number), pb=String(b).split("-").map(Number);
  if(pa.length!==3 || pb.length!==3 || pa.some(isNaN) || pb.some(isNaN)) return 0;
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}
const TOTAL_DIAS = CURSO.length;
function dialogosDe(d){ return d.dialogos || (d.dialogo ? [d.dialogo] : []); }

/* Índice global de frases (curso + emergencia) */

SOS.forEach(f => { if(!TODAS.some(x => idFrase(x.f)===idFrase(f))) TODAS.push({ f, dia:0, tituloDia:"Emergencias", linea:"!" }); });
const POR_ID = {};
TODAS.forEach(x => { POR_ID[idFrase(x.f)] = x; });

/* ============================================================================
   ESTADO — localStorage con try/catch en cada lectura y escritura
   ========================================================================= */
const CLAVE = "manuevayol.v2";
const CLAVE_VIEJA = "manuevayol.v1";
/* El curso viejo tenía 14 días; así se mapean a los 7 nuevos.
   Los días 7 y 14 eran de repaso y no tienen equivalente. */
const MAPA_VIEJO = {1:1,2:1,3:2,4:3,5:4,6:4,8:5,9:5,10:6,11:6,12:4,13:7};
let almacenamientoOk = true;
const estadoInicial = () => ({ v:2, dia:1, frases:{}, racha:0, ultima:null, hechos:[], lento:false });
let E = estadoInicial();

function leerClave(k){
  try{
    const crudo = window.localStorage.getItem(k);
    return crudo ? JSON.parse(crudo) : null;
  }catch(err){ almacenamientoOk = false; return null; }
}
function sanear(p){
  const s = estadoInicial();
  if(!p || typeof p !== "object") return s;
  s.dia = Math.min(Math.max(1, Number(p.dia)||1), TOTAL_DIAS);
  s.racha = Math.max(0, Number(p.racha)||0);
  s.ultima = (typeof p.ultima === "string") ? p.ultima : null;
  s.lento = !!p.lento;
  s.hechos = Array.isArray(p.hechos)
    ? p.hechos.map(Number).filter(n => n >= 1 && n <= TOTAL_DIAS).filter((n,i,a) => a.indexOf(n)===i)
    : [];
  if(p.frases && typeof p.frases === "object"){
    Object.keys(p.frases).forEach(id => {
      const e = p.frases[id];
      if(e && typeof e === "object" && Number(e.caja) >= 1){
        s.frases[id] = { caja: Math.min(5, Math.round(Number(e.caja))), prox: (typeof e.prox === "string" ? e.prox : null) };
      }
    });
  }
  return s;
}
function migrarDe14a7(viejo){
  const s = sanear({ frases:viejo.frases, racha:viejo.racha, ultima:viejo.ultima, lento:viejo.lento, dia:1, hechos:[] });
  const viejosHechos = Array.isArray(viejo.hechos) ? viejo.hechos.map(Number) : [];
  // Un día nuevo cuenta como hecho sólo si estaban hechos todos los viejos que lo forman.
  for(let n = 1; n <= TOTAL_DIAS; n++){
    const parts = Object.keys(MAPA_VIEJO).filter(k => MAPA_VIEJO[k] === n).map(Number);
    if(parts.length && parts.every(p => viejosHechos.indexOf(p) >= 0)) s.hechos.push(n);
  }
  let prox = 1;
  while(prox <= TOTAL_DIAS && s.hechos.indexOf(prox) >= 0) prox++;
  s.dia = Math.min(prox, TOTAL_DIAS);
  return s;
}
function cargar(){
  const nuevo = leerClave(CLAVE);
  if(nuevo){ E = sanear(nuevo); return; }
  const viejo = leerClave(CLAVE_VIEJA);
  if(viejo){
    try{ E = migrarDe14a7(viejo); }
    catch(err){ E = estadoInicial(); }
    guardar();
    return;
  }
  E = estadoInicial();
}
function guardar(){
  try{ window.localStorage.setItem(CLAVE, JSON.stringify(E)); }
  catch(err){ almacenamientoOk = false; }
}
function borrarTodo(){
  try{ window.localStorage.removeItem(CLAVE); window.localStorage.removeItem(CLAVE_VIEJA); }
  catch(err){ almacenamientoOk = false; }
  E = estadoInicial();
}

/* ---- Leitner de 5 cajas ---- */
const ESPERA = [0, 1, 2, 4, 8]; // días de espera según la caja (1 a 5)
function estadoFrase(id){
  const e = E.frases[id];
  return (e && typeof e.caja === "number") ? e : { caja:0, prox:null };
}
function registrar(id, acerto){
  const e = estadoFrase(id);
  const caja = acerto ? Math.min(5, Math.max(1, e.caja + 1)) : 1;
  E.frases[id] = { caja, prox: hoyISO(new Date(Date.now() + ESPERA[caja-1]*86400000)) };
  guardar();
}
function vencida(id){
  const e = estadoFrase(id);
  if(e.caja === 0 || e.caja >= 5) return false;
  return !e.prox || diasEntre(e.prox, hoyISO()) >= 0;
}
function vencidas(){ return Object.keys(E.frases).filter(id => vencida(id) && POR_ID[id]); }
function dominadas(){ return Object.keys(E.frases).filter(id => estadoFrase(id).caja >= 4 && POR_ID[id]).length; }
function porcentaje(){ return TODAS.length ? Math.round(dominadas()*100/TODAS.length) : 0; }
function marcarSesion(){
  const hoy = hoyISO();
  if(E.ultima === hoy){ /* ya contada */ }
  else if(E.ultima && diasEntre(E.ultima, hoy) === 1){ E.racha = (E.racha||0) + 1; }
  else { E.racha = 1; }
  E.ultima = hoy;
  guardar();
}

/* ============================================================================
   AUDIO — si no hay voces en inglés, se esconde todo lo de audio
   ========================================================================= */
const Audio_ = {
  ok:false, voz:null,
  buscarVoz(){
    if(!("speechSynthesis" in window)) return false;
    let vs = [];
    try{ vs = window.speechSynthesis.getVoices() || []; }catch(err){ return false; }
    if(!vs.length) return false;
    this.voz = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    return !!this.voz;
  },
  iniciar(alCambiar){
    if(!("speechSynthesis" in window)){ alCambiar(); return; }
    const probar = () => { const antes = this.ok; this.ok = this.buscarVoz(); if(this.ok !== antes) alCambiar(); };
    probar();
    try{ window.speechSynthesis.onvoiceschanged = probar; }catch(err){}
    setTimeout(probar, 400); setTimeout(probar, 1600);
  },
  decir(texto){
    if(!this.ok || !texto) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      if(this.voz){ u.voice = this.voz; u.lang = this.voz.lang; } else { u.lang = "en-US"; }
      u.rate = E.lento ? 0.6 : 0.92;
      window.speechSynthesis.speak(u);
    }catch(err){}
  }
};
function limpiarParaVoz(t){ return String(t||"").replace(/\([^)]*\)/g,"").trim(); }
function botonAudio(texto, etiqueta){
  if(!Audio_.ok) return "";
  const t = limpiarParaVoz(texto);
  if(!t) return "";
  return '<button type="button" class="btn-audio" data-decir="'+esc(t)+'">'+ICO.play+' '+(etiqueta||"Escuchar")+'</button>';
}
function botonVelocidad(){
  if(!Audio_.ok) return "";
  return '<button type="button" class="btn-audio" id="btnVel" aria-pressed="'+(E.lento?"true":"false")
       + '" aria-label="Velocidad de la voz: '+(E.lento?"lenta":"normal")+'. Tocá para cambiar.">'
       + (E.lento ? "Voz lenta" : "Voz normal") + '</button>';
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-decir]");
  if(b){ Audio_.decir(b.getAttribute("data-decir")); return; }
  if(ev.target.closest("#btnVel")){
    E.lento = !E.lento; guardar();
    document.querySelectorAll("#btnVel").forEach(x => {
      x.textContent = E.lento ? "Voz lenta" : "Voz normal";
      x.setAttribute("aria-pressed", E.lento ? "true" : "false");
      x.setAttribute("aria-label", "Velocidad de la voz: " + (E.lento?"lenta":"normal") + ". Tocá para cambiar.");
    });
    avisar(E.lento ? "Velocidad lenta" : "Velocidad normal");
  }
});

    + '<button type="button" class="btn primario" id="mSi">Sí, reiniciar</button></div></div></div>';

/* ============================================================================
   EL DÍA — Aprender · Practicar · Usar
   ========================================================================= */
let sesion = null;

function abrirDia(n){
  const d = CURSO.find(x => x.dia === n);
  if(!d) return;
  const idsPropias = d.frases.map(idFrase);
  const repasoIds = vencidas().filter(id => idsPropias.indexOf(id) < 0).slice(0, 6);
  const repaso = repasoIds.map(id => POR_ID[id].f);
  sesion = {
    dato:d, repaso:repaso, frases:repaso.concat(d.frases),
    etapa:0, indice:-1, sentido:"der",
    ejercicios:null, ejIndice:0, aciertos:0,
    dlg:0, dlgTurno:0, dlgHistorial:[], dlgFallos:0, dlgArrancado:false
  };
  ir("dia");
}
function pintarDia(){
  if(!sesion){ ir("inicio"); return; }
  if(sesion.etapa === 0) etapaAprender();
  else if(sesion.etapa === 1) etapaPracticar();
  else etapaUsar();
}
function pasos(){
  const e = sesion.etapa;
  const p = (i,txt) => '<div class="paso'+(i<e?" hecho":"")+'"'+(i===e?' aria-current="step"':'')+'>'+(i<e?ICO.check:"")+txt+'</div>';
  return '<div class="pasos" role="group" aria-label="Etapas del día">'+p(0,"Aprender")+p(1,"Practicar")+p(2,"Usar")+'</div>';
}

/* ---------- Aprender ---------- */
function etapaAprender(){
  const d = sesion.dato, total = sesion.frases.length, i = sesion.indice;

  if(i < 0){
    let h = pasos()
      + '<p class="kicker">Día '+d.dia+' de '+TOTAL_DIAS+'</p>'
      + '<h2>'+esc(d.titulo)+'</h2>'
      + '<p>'+esc(d.intro)+'</p>';
    if(sesion.repaso.length){
      h += '<div class="dato"><div class="t">'+ICO.repaso+' Primero, el repaso</div>'
         + 'Antes de lo nuevo vas a ver '+sesion.repaso.length+' '+(sesion.repaso.length===1?"frase":"frases")+' de días anteriores que se te vencieron.</div>';
    }
    h += '<p class="apagado" style="font-size:var(--t-s)">'+total+' frases · deslizá o usá las flechas para pasar de una a otra.</p>'
      +  '<button type="button" class="btn primario grande" id="btnArranca">Arrancar</button>';
    VISTAS.dia.innerHTML = h;
    $("btnArranca").addEventListener("click", () => { sesion.indice = 0; sesion.sentido="der"; pintarDia(); });
    return;
  }

  if(i >= total){
    let h = pasos() + '<h2>Terminaste de verlas</h2>'
      + '<p>Viste las '+total+' frases del día. Ahora se practican: si te equivocás no pasa nada, la frase vuelve a la primera caja y la vas a ver de nuevo.</p>';
    (d.datos||[]).forEach(x => { h += '<div class="dato"><div class="t">'+ICO.info+' '+esc(x.t)+'</div>'+esc(x.d)+'</div>'; });
    h += '<div class="fila-btns"><button type="button" class="btn" data-paso="atras">Volver a verlas</button>'
       + '<button type="button" class="btn primario" data-paso="practicar">Practicar</button></div>';
    VISTAS.dia.innerHTML = h;
    VISTAS.dia.querySelector('[data-paso="atras"]').addEventListener("click", () => { sesion.indice = 0; sesion.sentido="izq"; pintarDia(); });
    VISTAS.dia.querySelector('[data-paso="practicar"]').addEventListener("click", () => { sesion.etapa = 1; pintarDia(); });
    return;
  }

  const f = sesion.frases[i];
  const esRepaso = sesion.repaso.indexOf(f) >= 0;
  VISTAS.dia.innerHTML = pasos()
    + '<p class="contador">Frase '+(i+1)+' de '+total+(esRepaso?" · repaso":"")+'</p>'
    + '<div class="tarjeta-frase entra-'+sesion.sentido+'" id="tarjeta">'
      + '<p class="frase-en">'+esc(f.en)+'</p>'
      + '<p class="frase-pron">'+esc(f.pron)+'</p>'
      + '<div class="audio-fila">'+botonAudio(f.en)+botonVelocidad()+'</div>'
      + '<p class="frase-es">'+esc(f.es)+'</p>'
      + '<p class="frase-uso">'+esc(f.uso)+'</p>'
    + '</div>'
    + '<div class="fila-btns">'
      + '<button type="button" class="btn" data-paso="prev"'+(i===0?" disabled":"")+' aria-label="Frase anterior">'+ICO.flIzq+' Anterior</button>'
      + '<button type="button" class="btn primario" data-paso="next" aria-label="Frase siguiente">'+(i===total-1?"Terminar":"Siguiente")+' '+ICO.flDer+'</button>'
    + '</div>';
  VISTAS.dia.querySelector('[data-paso="prev"]').addEventListener("click", () => moverTarjeta(-1));
  VISTAS.dia.querySelector('[data-paso="next"]').addEventListener("click", () => moverTarjeta(1));
  activarDeslizar($("tarjeta"));
  if(Audio_.ok) Audio_.decir(f.en);
}
function moverTarjeta(paso){
  if(paso < 0 && sesion.indice === 0) return;
  sesion.sentido = paso > 0 ? "der" : "izq";
  sesion.indice += paso;
  pintarDia();
}
function activarDeslizar(el){
  if(!el) return;
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", (ev) => {
    const t = ev.changedTouches[0]; x0 = t.clientX; y0 = t.clientY;
  }, { passive:true });
  el.addEventListener("touchend", (ev) => {
    if(x0 === null) return;
    const t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) moverTarjeta(dx < 0 ? 1 : -1);
  }, { passive:true });
}
document.addEventListener("keydown", (ev) => {
  if(vistaActual !== "dia" || !sesion || sesion.etapa !== 0 || sesion.indice < 0) return;
  if(ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if(ev.key === "ArrowRight"){ ev.preventDefault(); moverTarjeta(1); }
  if(ev.key === "ArrowLeft"){ ev.preventDefault(); moverTarjeta(-1); }
});

/* ---------- Practicar ---------- */
function distractores(correcta, campo, n){
  const mismoDia = sesion.frases.filter(f => f !== correcta);
  const resto = TODAS.map(x => x.f).filter(f => f !== correcta);
  const orden = mezclar(mismoDia).concat(mezclar(resto));
  const out = [];
  orden.forEach(f => {
    if(out.length >= n) return;
    if(!f[campo] || f[campo] === correcta[campo]) return;
    if(out.some(o => o[campo] === f[campo])) return;
    out.push(f);
  });
  return out;
}
function armarEjercicios(){
  const d = sesion.dato;
  const tipos = ["enEs","esEn","armar"];
  if(Audio_.ok) tipos.push("escucha");
  const ejs = [];
  sesion.frases.forEach((f,k) => ejs.push(construir(tipos[(k + Math.floor(Math.random()*tipos.length)) % tipos.length], f)));
  const turnos = [];
  dialogosDe(d).forEach(dl => (dl.turnos||[]).forEach(t => { if(t.opciones && t.opciones.length >= 3) turnos.push({ t, dl }); }));
  mezclar(turnos).slice(0,3).forEach(x => ejs.push(construirHueco(x.dl, x.t)));
  return mezclar(ejs.filter(Boolean)).slice(0, 18);
}
function construir(tipo, f){
  if(tipo === "enEs"){
    const o = distractores(f, "es", 3);
    if(o.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"¿Qué quiere decir esta frase?", muestra:f.en,
             opciones: mezclar([{txt:f.es, ok:true}].concat(o.map(x => ({txt:x.es, ok:false})))) };
  }
  if(tipo === "esEn"){
    const o = distractores(f, "en", 3);
    if(o.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"¿Cómo se dice esto en inglés?", muestra:f.es,
             opciones: mezclar([{txt:f.en, ok:true}].concat(o.map(x => ({txt:x.en, ok:false})))) };
  }
  if(tipo === "escucha"){
    const o = distractores(f, "en", 3);
    if(o.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"Escuchá y elegí qué se dijo", muestra:null,
             opciones: mezclar([{txt:f.en, ok:true}].concat(o.map(x => ({txt:x.en, ok:false})))) };
  }
  const palabras = f.en.split(/\s+/).filter(Boolean);
  if(palabras.length < 2 || palabras.length > 9) return construir("enEs", f);
  return { tipo:"armar", f, enunciado:"Ordená las palabras para decir esto:", muestra:f.es,
           banco: mezclar(palabras.map((p,i) => ({p,i}))) };
}
function construirHueco(dl, turno){
  const correcta = turno.opciones.find(o => o.ok) || turno.opciones[0];
  return { tipo:"hueco", f:{ en:correcta.en, pron:correcta.pron, es:correcta.es, uso:"" },
           personaje:dl.personaje, dice:turno.ellos,
           enunciado:"Completá lo que te toca decir a vos:",
           opciones: mezclar(turno.opciones.map(o => ({ txt:o.en, ok:!!o.ok, es:o.es, por:o.reaccion }))) };
}

function etapaPracticar(){
  if(!sesion.ejercicios){ sesion.ejercicios = armarEjercicios(); sesion.ejIndice = 0; sesion.aciertos = 0; }
  const ejs = sesion.ejercicios, i = sesion.ejIndice;

  if(i >= ejs.length){
    const pct = ejs.length ? Math.round(sesion.aciertos*100/ejs.length) : 100;
    VISTAS.dia.innerHTML = pasos()
      + '<h2>'+sesion.aciertos+' de '+ejs.length+' bien</h2>'
      + '<p>'+(pct>=80 ? "Muy bien. Las que erraste vuelven a la caja 1 y te las voy a mostrar en los próximos días."
                       : "Está perfecto equivocarse: así funciona el repaso. Las que erraste vuelven a aparecer pronto.")+'</p>'
      + '<div class="fila-btns"><button type="button" class="btn" data-paso="otra">Practicar otra vez</button>'
      + '<button type="button" class="btn primario" data-paso="usar">Usarlo en la calle</button></div>';
    VISTAS.dia.querySelector('[data-paso="otra"]').addEventListener("click", () => { sesion.ejercicios = null; pintarDia(); });
    VISTAS.dia.querySelector('[data-paso="usar"]').addEventListener("click", () => { sesion.etapa = 2; pintarDia(); });
    return;
  }

  const ej = ejs[i];
  let cuerpo = "";
  if(ej.tipo === "enEs" || ej.tipo === "esEn" || ej.tipo === "escucha"){
    cuerpo = '<div class="tarjeta-frase">';
    if(ej.tipo === "escucha"){
      cuerpo += '<p class="apagado" style="margin:0 0 .5rem">Tocá para escuchar las veces que quieras.</p>'
             +  '<div class="audio-fila" style="margin:0">'+botonAudio(ej.f.en)+botonVelocidad()+'</div>';
    } else {
      cuerpo += '<p class="frase-en" style="font-size:var(--t-2xl)">'+esc(ej.muestra)+'</p>';
      if(ej.tipo === "enEs") cuerpo += '<p class="frase-pron">'+esc(ej.f.pron)+'</p><div class="audio-fila" style="margin:0">'+botonAudio(ej.f.en)+'</div>';
    }
    cuerpo += '</div><div class="opciones" role="group" aria-label="Opciones">';
    ej.opciones.forEach((o,k) => {
      cuerpo += '<button type="button" class="opcion" data-op="'+k+'"><span class="letra" aria-hidden="true">'+String.fromCharCode(65+k)+'</span><span class="cuerpo">'+esc(o.txt)+'</span></button>';
    });
    cuerpo += '</div>';
  } else if(ej.tipo === "armar"){
    cuerpo = '<div class="tarjeta-frase"><p class="frase-es" style="margin:0">'+esc(ej.muestra)+'</p></div>'
      + '<div class="zona-armado" id="armado" role="group" aria-label="Tu frase"></div>'
      + '<div class="zona-banco" id="banco" role="group" aria-label="Palabras para ordenar"></div>'
      + '<div class="fila-btns"><button type="button" class="btn" id="btnLimpiar">Borrar</button>'
      + '<button type="button" class="btn primario" id="btnComprobar" disabled>Comprobar</button></div>';
  } else {
    cuerpo = '<div class="tarjeta-frase">'
      + '<p class="dialogo-linea"><span class="quien">'+esc(ej.personaje)+'</span>'+esc(ej.dice.en)+'</p>'
      + (ej.dice.es ? '<p class="apagado" style="font-size:var(--t-s)">'+esc(ej.dice.es)+'</p>' : "")
      + (Audio_.ok ? '<div class="audio-fila" style="margin:.5rem 0 0">'+botonAudio(ej.dice.en)+'</div>' : "")
      + '<p class="dialogo-linea" style="margin-top:.75rem"><span class="quien">Vos</span><span class="hueco">&nbsp;?&nbsp;</span></p>'
      + '</div><div class="opciones" role="group" aria-label="Opciones">';
    ej.opciones.forEach((o,k) => {
      cuerpo += '<button type="button" class="opcion" data-op="'+k+'"><span class="letra" aria-hidden="true">'+String.fromCharCode(65+k)+'</span>'
        + '<span class="cuerpo">'+esc(o.txt)+'<small>'+esc(o.es)+'</small></span></button>';
    });
    cuerpo += '</div>';
  }

  VISTAS.dia.innerHTML = pasos()
    + '<p class="contador">Ejercicio '+(i+1)+' de '+ejs.length+'</p>'
    + '<h3>'+esc(ej.enunciado)+'</h3>' + cuerpo + '<div id="zonaFeedback"></div>';

  if(ej.tipo === "escucha" && Audio_.ok) setTimeout(() => Audio_.decir(ej.f.en), 250);
  if(ej.tipo === "armar") montarArmado(ej);
  else VISTAS.dia.querySelectorAll("[data-op]").forEach(b =>
    b.addEventListener("click", () => responder(ej, Number(b.getAttribute("data-op")))));
}

function montarArmado(ej){
  const armado = $("armado"), banco = $("banco"), btnC = $("btnComprobar"), btnL = $("btnLimpiar");
  let puestas = [];
  function pintar(){
    armado.innerHTML = puestas.length
      ? puestas.map((w,k) => '<button type="button" class="ficha" data-quitar="'+k+'">'+esc(w.p)+'</button>').join("")
      : '<span class="apagado" style="padding:.5rem;font-size:var(--t-s)">Tocá las palabras de abajo en orden.</span>';
    banco.innerHTML = ej.banco.map((w,k) => {
      const usada = puestas.indexOf(w) >= 0;
      return '<button type="button" class="ficha'+(usada?" usada":"")+'" data-poner="'+k+'"'+(usada?' tabindex="-1" aria-hidden="true"':'')+'>'+esc(w.p)+'</button>';
    }).join("");
    btnC.disabled = puestas.length !== ej.banco.length;
    armado.querySelectorAll("[data-quitar]").forEach(b => b.addEventListener("click", () => { puestas.splice(Number(b.getAttribute("data-quitar")),1); pintar(); }));
    banco.querySelectorAll("[data-poner]").forEach(b => b.addEventListener("click", () => {
      const w = ej.banco[Number(b.getAttribute("data-poner"))];
      if(puestas.indexOf(w) < 0){ puestas.push(w); pintar(); }
    }));
  }
  pintar();
  btnL.addEventListener("click", () => { puestas = []; pintar(); });
  btnC.addEventListener("click", () => responder(ej, null, puestas.map(w => w.p).join(" ")));
}

function responder(ej, indice, textoArmado){
  const zona = $("zonaFeedback");
  let acerto, explic;

  if(ej.tipo === "armar"){
    acerto = normalizar(textoArmado) === normalizar(ej.f.en);
    explic = acerto
      ? 'Así se dice: <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'.'
      : 'El orden correcto es <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'. Vos pusiste: '+esc(textoArmado)+'.';
    document.querySelectorAll("#btnComprobar,#btnLimpiar,#banco .ficha,#armado .ficha").forEach(b => b.disabled = true);
    if(!acerto){ const z = $("armado"); if(z){ z.classList.add("opcion","mal"); } }
  } else {
    const op = ej.opciones[indice];
    acerto = !!op.ok;
    const correcta = ej.opciones.find(o => o.ok);
    VISTAS.dia.querySelectorAll("[data-op]").forEach(b => {
      const k = Number(b.getAttribute("data-op"));
      b.disabled = true;
      if(ej.opciones[k].ok) b.classList.add("ok");
      else if(k === indice) b.classList.add("mal");
      else b.classList.add("tenue");
    });
    if(ej.tipo === "hueco"){
      explic = acerto ? esc(op.por||"")
        : esc(op.por||"") + ' La que iba es <strong>'+esc(correcta.txt)+'</strong> ('+esc(correcta.es)+').';
    } else if(acerto){
      explic = '<strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'. '+esc(ej.f.uso||"");
    } else if(ej.tipo === "enEs"){
      const otra = TODAS.find(x => x.f.es === op.txt);
      explic = '<strong>'+esc(ej.f.en)+'</strong> quiere decir '+esc(ej.f.es)+'.'
             + (otra ? ' Lo que elegiste es lo que quiere decir <strong>'+esc(otra.f.en)+'</strong>.' : '');
    } else {
      const otra = TODAS.find(x => x.f.en === op.txt);
      explic = 'Se dice <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'.'
             + (otra ? ' Lo que elegiste, '+esc(otra.f.en)+', quiere decir '+esc(otra.f.es)+'.' : '')
             + ' ' + esc(ej.f.uso||"");
    }
  }

  if(POR_ID[idFrase(ej.f)]) registrar(idFrase(ej.f), acerto);
  if(acerto) sesion.aciertos++;

  zona.innerHTML = '<div class="feedback '+(acerto?"ok":"mal")+'">'
    + '<div class="titulo">'+(acerto?ICO.check:ICO.cruz)+(acerto?"Bien":"No era esa")+'</div><div>'+explic+'</div></div>'
    + (Audio_.ok ? '<div class="audio-fila">'+botonAudio(ej.f.en)+botonVelocidad()+'</div>' : "")
    + '<button type="button" class="btn primario bloque" id="btnSeguir">Seguir</button>';
  avisar((acerto?"Correcto. ":"Incorrecto. ") + ej.f.en);
  $("btnSeguir").addEventListener("click", () => { sesion.ejIndice++; pintarDia(); });
  $("btnSeguir").focus();
}

/* ---------- Usar: simulacros ---------- */
function etapaUsar(){
  const d = sesion.dato, lista = dialogosDe(d), dlg = lista[sesion.dlg];
  if(!dlg){ terminarDia(); return; }

  if(!sesion.dlgArrancado){
    VISTAS.dia.innerHTML = pasos()
      + '<p class="kicker">Simulacro '+(sesion.dlg+1)+' de '+lista.length+'</p>'
      + '<h2>'+esc(dlg.personaje)+'</h2>'
      + '<div class="escena">'+esc(dlg.escena)+'</div>'
      + '<p>Vas a elegir qué contestar en cada turno. Si elegís mal, mirá cómo reacciona y probá de nuevo: nadie te está tomando examen.</p>'
      + '<button type="button" class="btn primario grande" id="btnArrancaDlg">Empezar la conversación</button>';
    $("btnArrancaDlg").addEventListener("click", () => { sesion.dlgArrancado = true; pintarDia(); });
    return;
  }

  const t = sesion.dlgTurno;
  if(t >= dlg.turnos.length){
    if(sesion.dlg + 1 < lista.length){
      sesion.dlg++; sesion.dlgTurno = 0; sesion.dlgHistorial = []; sesion.dlgArrancado = false;
      pintarDia(); return;
    }
    terminarDia(); return;
  }

  const turno = dlg.turnos[t];
  let h = pasos()
    + '<p class="contador">Turno '+(t+1)+' de '+dlg.turnos.length+' · '+esc(dlg.personaje)+'</p>'
    + '<div class="escena">'+esc(dlg.escena)+'</div><div class="chat">';
  sesion.dlgHistorial.forEach(x => {
    h += '<div class="burbuja '+(x.tipo==="vos"?"vos":"ellos")+'">'+esc(x.en)
       + (x.pron?'<span class="pron">'+esc(x.pron)+'</span>':"")
       + (x.es?'<span class="trad">'+esc(x.es)+'</span>':"")+'</div>';
  });
  h += '<div class="burbuja ellos nueva">'+esc(turno.ellos.en)
     + (turno.ellos.pron?'<span class="pron">'+esc(turno.ellos.pron)+'</span>':"")
     + (turno.ellos.es?'<span class="trad">'+esc(turno.ellos.es)+'</span>':"")+'</div></div>';
  if(turno.nota) h += '<div class="aviso"><div class="t">'+ICO.info+' Ojo</div>'+esc(turno.nota)+'</div>';
  if(Audio_.ok && limpiarParaVoz(turno.ellos.en)) h += '<div class="audio-fila">'+botonAudio(turno.ellos.en)+botonVelocidad()+'</div>';
  h += '<h3>¿Qué contestás?</h3><div class="opciones" role="group" aria-label="Qué contestás">';
  turno.opciones.forEach((o,k) => {
    h += '<button type="button" class="opcion" data-dlg="'+k+'"><span class="letra" aria-hidden="true">'+String.fromCharCode(65+k)+'</span>'
      + '<span class="cuerpo">'+esc(o.en)+'<small>'+esc(o.pron)+' · '+esc(o.es)+'</small></span></button>';
  });
  h += '</div><div id="zonaFeedback"></div>';

  VISTAS.dia.innerHTML = h;
  VISTAS.dia.querySelectorAll("[data-dlg]").forEach(b =>
    b.addEventListener("click", () => responderDialogo(turno, Number(b.getAttribute("data-dlg")))));
  if(Audio_.ok) Audio_.decir(limpiarParaVoz(turno.ellos.en));
}

function responderDialogo(turno, k){
  const o = turno.opciones[k], zona = $("zonaFeedback");
  VISTAS.dia.querySelectorAll("[data-dlg]").forEach(b => {
    const j = Number(b.getAttribute("data-dlg"));
    b.disabled = true;
    if(j === k) b.classList.add(o.ok ? "ok" : "mal"); else b.classList.add("tenue");
  });
  if(POR_ID[idFrase({en:o.en})]) registrar(idFrase({en:o.en}), !!o.ok);

  zona.innerHTML = '<div class="feedback '+(o.ok?"ok":"mal")+'">'
    + '<div class="titulo">'+(o.ok?ICO.check:ICO.cruz)+(o.ok?"Funcionó":"Salió mal")+'</div><div>'+esc(o.reaccion)+'</div></div>'
    + (Audio_.ok ? '<div class="audio-fila">'+botonAudio(o.en)+botonVelocidad()+'</div>' : "")
    + (o.ok ? '<button type="button" class="btn primario bloque" id="btnSeguirDlg">Seguir</button>'
            : '<button type="button" class="btn primario bloque" id="btnReintentar">Probar otra vez</button>');
  avisar(o.ok ? "Correcto" : "Incorrecto");

  if(o.ok){
    $("btnSeguirDlg").addEventListener("click", () => {
      sesion.dlgHistorial.push({ tipo:"ellos", en:turno.ellos.en, pron:turno.ellos.pron, es:turno.ellos.es });
      sesion.dlgHistorial.push({ tipo:"vos", en:o.en, pron:o.pron, es:o.es });
      sesion.dlgTurno++; pintarDia();
    });
    $("btnSeguirDlg").focus();
  } else {
    sesion.dlgFallos++;
    $("btnReintentar").addEventListener("click", () => pintarDia());
    $("btnReintentar").focus();
  }
}

/* ---------- Fin del día: el tren llega a la estación siguiente ---------- */
function terminarDia(){
  const d = sesion.dato;
  const eraNuevo = E.hechos.indexOf(d.dia) < 0;
  if(eraNuevo) E.hechos.push(d.dia);
  const desdeDia = d.dia;
  if(E.dia === d.dia && d.dia < TOTAL_DIAS) E.dia = d.dia + 1;
  marcarSesion(); guardar();

  const hastaDia = Math.min(desdeDia + 1, TOTAL_DIAS);
  // Cada punto es un flex item de 1/TOTAL: su centro cae en (n - 0.5) / TOTAL.
  const centro = (n) => ((n - 0.5) / TOTAL_DIAS) * 100;
  const quedan = TOTAL_DIAS - E.hechos.length;

  let h = '<div class="fin">'
    + '<p class="kicker">Día '+d.dia+' de '+TOTAL_DIAS+' terminado</p>'
    + '<h2>'+(quedan === 0 ? "Terminaste el curso" : "Lo hiciste entero")+'</h2>'
    + '<p>'+(sesion.dlgFallos
        ? 'Te equivocaste '+sesion.dlgFallos+' '+(sesion.dlgFallos===1?"vez":"veces")+' en los simulacros y lo resolviste igual: eso es exactamente lo que va a pasar en la calle.'
        : 'Cerraste todos los simulacros sin un solo error.')+'</p></div>';

  h += '<div class="mini-linea" aria-hidden="true"><span class="riel-mini"></span>'
    +  '<span class="riel-hecho" style="width:'+centro(desdeDia)+'%"></span>';
  for(let n=1;n<=TOTAL_DIAS;n++) h += '<span class="punto'+(n<=desdeDia?" hecho":"")+'"><i></i></span>';
  h += '<span class="tren" style="--desde:calc('+centro(desdeDia)+'% - 15px);--hasta:calc('+centro(hastaDia)+'% - 15px)">'+ICO.tren+'</span></div>'
    +  '<p class="apagado" style="font-size:var(--t-s);text-align:center;margin-top:-.5rem">'
    +  (quedan === 0 ? "Última estación." : "Próxima estación: día "+hastaDia+", "+esc(CURSO[hastaDia-1].titulo)+".")+'</p>';

  h += '<div class="metricas">'
    + '<div class="metrica"><div class="n">'+sesion.frases.length+'</div><div class="r">Frases vistas</div></div>'
    + '<div class="metrica"><div class="n">'+(E.racha||0)+'</div><div class="r">Días seguidos</div></div>'
    + '<div class="metrica"><div class="n">'+porcentaje()+'%</div><div class="r">Dominadas</div></div>'
    + '</div>';

  h += '<div class="panel"><h3 style="font-size:var(--t-l)">Lo que aprendiste hoy</h3><ul class="fin-lista">'
    + d.frases.slice(0,6).map(f => '<li><span class="e">'+esc(f.en)+'</span><span class="s">'+esc(f.es)+'</span></li>').join("")
    + '</ul>'+(d.frases.length>6 ? '<p class="apagado" style="font-size:var(--t-s);margin:.5rem 0 0">…y '+(d.frases.length-6)+' más. Están todas en el buscador.</p>' : '')+'</div>'
    + '<p class="apagado" style="font-size:var(--t-s)">Volvé mañana: las frases que erraste se te van a mezclar al principio del próximo día.</p>'
    + '<div class="fila-btns"><button type="button" class="btn" data-paso="rehacer">Rehacer este día</button>'
    + '<button type="button" class="btn primario" data-ir="inicio">Ir al inicio</button></div>';

  VISTAS.dia.innerHTML = h;
  VISTAS.dia.querySelector('[data-paso="rehacer"]').addEventListener("click", () => abrirDia(d.dia));
  avisar("Día terminado");
}

/* ============================================================================
   BUSCADOR
   ========================================================================= */
function pintarBuscar(){
  if(VISTAS.buscar.dataset.listo !== "1"){
    VISTAS.buscar.innerHTML = '<p class="kicker">Buscador</p><h2>Buscá cualquier frase</h2>'
      + '<label class="sr" for="q">Buscar una frase en español o en inglés</label>'
      + '<input type="search" id="q" placeholder="cuánto cuesta, check, baño, subte…" autocomplete="off" autocorrect="off" spellcheck="false">'
      + '<div id="resultados" aria-live="polite" style="margin-top:.875rem"></div>';
    VISTAS.buscar.dataset.listo = "1";
    $("q").addEventListener("input", (ev) => buscar(ev.target.value));
  }
  buscar($("q").value || "");
  $("q").focus();
}
function resaltar(txt, q){
  const n = normalizar(txt), nq = normalizar(q);
  if(!nq) return esc(txt);
  const p = n.indexOf(nq);
  if(p < 0) return esc(txt);
  let vistos = 0, ini = -1, fin = -1;
  for(let i = 0; i < txt.length; i++){
    const c = normalizar(txt[i]);
    if(ini < 0 && vistos === p && c) ini = i;
    if(c) vistos += c.length;
    if(ini >= 0 && vistos >= p + nq.length){ fin = i + 1; break; }
  }
  if(ini < 0) return esc(txt);
  if(fin < 0) fin = txt.length;
  return esc(txt.slice(0,ini)) + "<mark>" + esc(txt.slice(ini,fin)) + "</mark>" + esc(txt.slice(fin));
}
function buscar(q){
  const cont = $("resultados"), nq = normalizar(q);
  let lista = TODAS;
  if(nq){
    lista = TODAS.filter(x => normalizar(x.f.en).indexOf(nq) >= 0 || normalizar(x.f.es).indexOf(nq) >= 0
                           || normalizar(x.f.pron).indexOf(nq) >= 0 || normalizar(x.f.uso||"").indexOf(nq) >= 0);
    lista = lista.slice().sort((a,b) => {
      const pos = (x) => Math.min.apply(null, [normalizar(x.f.en).indexOf(nq), normalizar(x.f.es).indexOf(nq)].filter(v => v >= 0).concat([99]));
      return pos(a) - pos(b);
    });
  }
  if(!lista.length){
    cont.innerHTML = '<div class="panel"><p style="margin:0">No hay ninguna frase con <strong>'+esc(q)+'</strong>. Probá con una palabra más corta: <em>cuenta</em>, <em>baño</em>, <em>train</em>.</p></div>';
    return;
  }
  const tope = lista.slice(0, 60);
  cont.innerHTML = '<p class="contador">'+lista.length+' '+(lista.length===1?"frase":"frases")+(nq?"":" en total")+'</p>'
    + tope.map(x =>
        '<div class="resultado'+(x.dia?" d"+x.dia:"")+'">'
        + '<span class="disco chico" aria-hidden="true" style="'+(x.dia?"":"background:var(--sos);color:var(--sos-tinta)")+'">'+esc(x.linea)+'</span>'
        + '<span class="txt"><span class="en">'+resaltar(x.f.en,q)+'</span>'
        + '<span class="pr">'+resaltar(x.f.pron,q)+'</span>'
        + '<span class="es">'+resaltar(x.f.es,q)+'</span>'
        + '<span class="de">'+(x.dia ? "Día "+x.dia+" · "+esc(x.tituloDia) : "Emergencia")+'</span></span>'
        + (Audio_.ok ? '<span>'+botonAudio(x.f.en,"")+'</span>' : "")
        + '</div>').join("")
    + (lista.length > tope.length ? '<p class="apagado" style="font-size:var(--t-s)">Se muestran las primeras '+tope.length+'. Escribí algo más para afinar.</p>' : "");
}

/* ============================================================================
   MODO EMERGENCIA
   ========================================================================= */
function pintarSOS(){
  VISTAS.sos.innerHTML = '<div class="sos-cabecera">'
    + '<h2>Emergencia</h2>'
    + '<p style="margin:0 0 .25rem">Policía, bomberos y ambulancia. Gratis desde cualquier teléfono, aunque no tengas chip ni saldo.</p>'
    + '<div class="sos-911">911</div>'
    + '<p style="margin:.375rem 0 0"><strong>Se dice:</strong> nine one one (náin uán UÁN)</p></div>'
  + '<div class="dato"><div class="t">'+ICO.info+' Pedí intérprete en español</div>'
    + 'Apenas atiendan, decí <strong>Spanish, please</strong> (SPÁ-nish pliis) o <strong>I need an interpreter in Spanish</strong>. '
    + 'Es gratis, es tu derecho y tardan menos de un minuto en poner a alguien en la línea. No cortes: quedate en el teléfono hasta que te lo digan.</div>'
  + '<h3>Frases para decir ya</h3>'
  + SOS.map(f => '<div class="sos-frase">'
      + '<div class="en">'+esc(f.en)+'</div>'
      + '<div class="pr">'+esc(f.pron)+'</div>'
      + '<div class="es">'+esc(f.es)+'</div>'
      + (Audio_.ok ? '<div class="audio-fila" style="margin:.5rem 0 0">'+botonAudio(f.en)+'</div>' : "")
      + '<p class="frase-uso" style="margin-top:.5rem">'+esc(f.uso)+'</p></div>').join("")
  + '<div class="panel"><h3 style="font-size:var(--t-l)">Antes de que pase algo</h3>'
    + '<p style="margin:0;font-size:var(--t-s)">Tené a mano, en el teléfono y en papel: tu alergia y tu medicación escritas en inglés, el teléfono del consulado argentino en Nueva York, una foto del pasaporte y el número de tu seguro de viaje. '
    + 'El hospital para urgencias se llama <strong>emergency room</strong> (ER).</p></div>'
  + '<button type="button" class="btn bloque" data-ir="inicio">Volver</button>';
}

/* ============================================================================
   ARRANQUE
   ========================================================================= */
function refrescarPorAudio(){
  if(vistaActual === "buscar"){ const i = $("q"); buscar(i ? i.value : ""); }
  else if(vistaActual === "inicio") pintarInicio();
  else if(vistaActual === "sos") pintarSOS();
}
document.addEventListener("keydown", (ev) => {
  if(ev.key === "Escape" && (vistaActual === "buscar" || vistaActual === "sos")) ir(vistaPrevia || "inicio");
});

cargar();
if(E.ultima && diasEntre(E.ultima, hoyISO()) > 1){ E.racha = 0; guardar(); }
Audio_.iniciar(refrescarPorAudio);
ir("inicio", { sinFoco:true });
</script>
