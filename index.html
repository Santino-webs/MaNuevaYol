<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Curso de 14 días de inglés de supervivencia para viajar a Nueva York.">
<meta name="theme-color" content="#0a0a0a">
<title>Ma Nueva Yol · Inglés de calle en 14 días</title>
<style>
/* ============================================================
   PALETA — señalética del subte de Nueva York.
   TODOS los colores viven acá. El media query oscuro sólo los
   redefine: ningún color se declara únicamente ahí adentro.
   ============================================================ */
:root{
  color-scheme: light dark;

  /* Discos de línea (MTA) — idénticos en ambos temas, son señalética */
  --mta-azul:    #0039a6;  /* A C E */
  --mta-naranja: #ff6319;  /* B D F M */
  --mta-amarillo:#fccc0a;  /* N Q R W */
  --mta-rojo:    #ee352e;  /* 1 2 3 */
  --mta-verde:   #00933c;  /* 4 5 6 */
  --mta-violeta: #b933ad;  /* 7 */
  --mta-gris:    #a7a9ac;  /* L */
  --mta-lima:    #6cbe45;  /* G */

  /* Superficies */
  --fondo:        #f2f2f0;
  --panel:        #ffffff;
  --panel-2:      #e8e8e5;
  --panel-3:      #dcdcd8;
  --barra:        #0a0a0a;
  --barra-txt:    #ffffff;

  /* Texto */
  --txt:          #0a0a0a;
  --txt-2:        #4a4a48;
  --txt-3:        #6b6b68;
  --txt-inv:      #ffffff;

  /* Bordes y foco */
  --borde:        #0a0a0a;
  --borde-suave:  #c4c4c0;
  --foco:         #0039a6;
  --foco-halo:    #ffffff;

  /* Semánticos */
  --ok:           #00701f;
  --ok-fondo:     #d6f0dc;
  --ok-borde:     #00701f;
  --mal:          #b2211c;
  --mal-fondo:    #fbdedd;
  --mal-borde:    #b2211c;
  --alerta:       #9a4b00;
  --alerta-fondo: #ffeacc;
  --emergencia:   #d31f1a;
  --emergencia-txt:#ffffff;
  --dato:         #4a2a86;
  --dato-fondo:   #ece4ff;

  /* Acentos de UI */
  --acento:       #0039a6;
  --acento-txt:   #ffffff;
  --sombra:       0 2px 0 0 #0a0a0a;
  --sombra-alta:  0 4px 0 0 #0a0a0a;
  --velo:         rgba(10,10,10,.58);

  /* Métricas */
  --toque: 44px;
  --radio: 2px;
  --ancho: 560px;
  --fuente: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
}

@media (prefers-color-scheme: dark){
  :root{
    --fondo:        #0b0b0c;
    --panel:        #17181a;
    --panel-2:      #212327;
    --panel-3:      #2c2f34;
    --barra:        #000000;
    --barra-txt:    #ffffff;

    --txt:          #f4f4f2;
    --txt-2:        #c3c5c9;
    --txt-3:        #9b9ea4;
    --txt-inv:      #0a0a0a;

    --borde:        #6f747c;
    --borde-suave:  #3a3d43;
    --foco:         #7fb0ff;
    --foco-halo:    #000000;

    --ok:           #63d98a;
    --ok-fondo:     #10301c;
    --ok-borde:     #2f9c56;
    --mal:          #ff8a84;
    --mal-fondo:    #3a1413;
    --mal-borde:    #c0413b;
    --alerta:       #ffc06b;
    --alerta-fondo: #38270f;
    --emergencia:   #d92e27;
    --emergencia-txt:#ffffff;
    --dato:         #c9b4ff;
    --dato-fondo:   #241a3d;

    --acento:       #4d8dff;
    --acento-txt:   #06122b;
    --sombra:       0 2px 0 0 #000000;
    --sombra-alta:  0 4px 0 0 #000000;
    --velo:         rgba(0,0,0,.72);
  }
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--fondo);
  color:var(--txt);
  font-family:var(--fuente);
  font-size:17px;
  line-height:1.45;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img,svg{ max-width:100%; }
[hidden]{ display:none !important; }

/* ---- Foco visible de punta a punta ---- */
:focus{ outline:none; }
:focus-visible{
  outline:3px solid var(--foco);
  outline-offset:2px;
  box-shadow:0 0 0 2px var(--foco-halo);
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* ============================================================
   ESTRUCTURA
   ============================================================ */
#app{
  max-width:var(--ancho);
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--fondo);
}

/* Barra superior tipo cartel de andén */
.barra{
  position:sticky; top:0; z-index:40;
  background:var(--barra); color:var(--barra-txt);
  display:flex; align-items:center; gap:8px;
  padding:6px 8px;
  padding-top:calc(6px + env(safe-area-inset-top));
  border-bottom:4px solid var(--mta-amarillo);
}
.barra h1{
  font-size:15px; margin:0; letter-spacing:.14em; text-transform:uppercase;
  font-weight:800; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.barra-btn{
  min-width:var(--toque); min-height:var(--toque);
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:transparent; color:var(--barra-txt);
  border:2px solid var(--barra-txt); border-radius:var(--radio);
  font:inherit; font-size:13px; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; cursor:pointer; padding:0 10px;
}
.barra-btn:hover{ background:var(--barra-txt); color:var(--barra); }
.barra-btn.sos{
  background:var(--emergencia); color:var(--emergencia-txt);
  border-color:var(--emergencia);
}
.barra-btn.sos:hover{ filter:brightness(1.12); background:var(--emergencia); color:var(--emergencia-txt); }
.barra-btn .ico{ font-size:17px; line-height:1; }

main{ flex:1; padding:16px 14px 96px; }
.vista[hidden]{ display:none !important; }

/* ---- Tipografía ---- */
.kicker{
  font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  color:var(--txt-3); margin:0 0 6px;
}
h2{ font-size:26px; line-height:1.15; margin:0 0 8px; letter-spacing:-.02em; }
h3{ font-size:18px; margin:0 0 8px; letter-spacing:-.01em; }
p{ margin:0 0 12px; }
.apagado{ color:var(--txt-2); }

/* ---- Disco de línea ---- */
.disco{
  width:38px; height:38px; flex:0 0 38px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; color:#fff;
  font-variant-numeric:tabular-nums;
}
.disco.chico{ width:28px; height:28px; flex-basis:28px; font-size:14px; }
.disco.sobre-claro{ color:#0a0a0a; }

/* ---- Tarjetas / paneles ---- */
.panel{
  background:var(--panel);
  border:2px solid var(--borde);
  border-radius:var(--radio);
  padding:14px;
  margin:0 0 14px;
}
.panel.plano{ border-color:var(--borde-suave); }

/* ---- Botones ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--toque); padding:10px 16px;
  font:inherit; font-weight:800; letter-spacing:.03em;
  background:var(--panel); color:var(--txt);
  border:2px solid var(--borde); border-radius:var(--radio);
  cursor:pointer; text-align:center;
  transition:transform .08s ease, background .12s ease;
}
.btn:hover{ background:var(--panel-2); }
.btn:active{ transform:translateY(2px); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.primario{
  background:var(--acento); color:var(--acento-txt); border-color:var(--acento);
}
.btn.primario:hover{ filter:brightness(1.08); }
.btn.grande{
  width:100%; font-size:19px; min-height:58px; text-transform:uppercase;
  box-shadow:var(--sombra-alta);
}
.btn.bloque{ width:100%; }
.btn.sos{ background:var(--emergencia); color:var(--emergencia-txt); border-color:var(--emergencia); }
.fila-btns{ display:flex; gap:10px; flex-wrap:wrap; }
.fila-btns .btn{ flex:1 1 140px; }

/* ---- Métricas de inicio ---- */
.metricas{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 14px; }
.metrica{
  background:var(--panel); border:2px solid var(--borde); border-radius:var(--radio);
  padding:10px 8px; text-align:center; min-width:0;
}
.metrica .n{ font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.metrica .r{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--txt-2); margin-top:4px; }

/* ---- Barra de progreso ---- */
.progreso{
  height:14px; background:var(--panel-3); border:2px solid var(--borde);
  border-radius:var(--radio); overflow:hidden;
}
.progreso > i{ display:block; height:100%; background:var(--mta-verde); }

/* ---- Lista de días ---- */
.lista-dias{ list-style:none; margin:0; padding:0; }
.dia-item{
  display:flex; align-items:center; gap:10px; width:100%;
  background:var(--panel); border:2px solid var(--borde-suave); border-radius:var(--radio);
  padding:8px 10px; margin-bottom:8px; min-height:var(--toque);
  font:inherit; color:var(--txt); text-align:left; cursor:pointer;
}
.dia-item:hover{ background:var(--panel-2); }
.dia-item.actual{ border-color:var(--borde); border-width:3px; box-shadow:var(--sombra); }
.dia-item .txt{ flex:1; min-width:0; }
.dia-item .t{ display:block; font-weight:700; font-size:16px; }
.dia-item .s{ display:block; font-size:12px; color:var(--txt-2); }
.dia-item .est{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--txt-3); }
.dia-item .est.listo{ color:var(--ok); }

/* ---- Pasos del día ---- */
.pasos{ display:flex; gap:6px; margin:0 0 14px; }
.paso{
  flex:1; text-align:center; font-size:11px; font-weight:800;
  text-transform:uppercase; letter-spacing:.08em;
  padding:8px 4px; border:2px solid var(--borde-suave); border-radius:var(--radio);
  background:var(--panel); color:var(--txt-3);
}
.paso[aria-current="step"]{ background:var(--barra); color:var(--barra-txt); border-color:var(--barra); }
.paso.hecho{ color:var(--ok); border-color:var(--ok-borde); }

/* ---- Tarjeta de frase ---- */
.frase-en{
  font-size:clamp(28px,8.5vw,40px); font-weight:800; line-height:1.1;
  letter-spacing:-.02em; margin:0 0 10px; overflow-wrap:break-word;
}
.frase-pron{
  font-size:19px; font-weight:700; color:var(--acento);
  margin:0 0 10px; overflow-wrap:break-word;
}
.frase-pron .ton{ text-transform:uppercase; }
.frase-es{ font-size:19px; margin:0 0 12px; }
.frase-uso{
  font-size:15px; color:var(--txt-2); border-left:4px solid var(--mta-amarillo);
  padding-left:10px; margin:0;
}
.contador{ font-size:12px; font-weight:800; letter-spacing:.1em; color:var(--txt-3); text-transform:uppercase; }

/* ---- Audio ---- */
.audio-fila{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.btn-audio{
  min-height:var(--toque); min-width:var(--toque);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:0 14px; font:inherit; font-weight:800; font-size:14px;
  background:var(--panel-2); color:var(--txt);
  border:2px solid var(--borde); border-radius:var(--radio); cursor:pointer;
}
.btn-audio:hover{ background:var(--panel-3); }
.btn-audio.mini{ padding:0 10px; font-size:13px; }
.btn-audio[aria-pressed="true"]{ background:var(--barra); color:var(--barra-txt); }

/* ---- Ejercicios ---- */
.opciones{ display:grid; gap:8px; margin:0 0 12px; }
.opcion{
  display:flex; align-items:center; gap:10px; width:100%;
  min-height:var(--toque); padding:12px 14px;
  font:inherit; font-size:17px; text-align:left;
  background:var(--panel); color:var(--txt);
  border:2px solid var(--borde); border-radius:var(--radio); cursor:pointer;
}
.opcion:hover:not([disabled]){ background:var(--panel-2); }
.opcion[disabled]{ cursor:default; }
.opcion .marca{ font-weight:800; font-size:18px; flex:0 0 auto; }
.opcion.ok{ background:var(--ok-fondo); border-color:var(--ok-borde); color:var(--txt); }
.opcion.mal{ background:var(--mal-fondo); border-color:var(--mal-borde); color:var(--txt); }
.opcion.tenue{ opacity:.5; }

/* Armar frase */
.zona-armado{
  min-height:64px; background:var(--panel-2);
  border:2px dashed var(--borde-suave); border-radius:var(--radio);
  padding:8px; margin:0 0 10px;
  display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start;
}
.zona-banco{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
.ficha{
  min-height:var(--toque); padding:8px 12px;
  font:inherit; font-size:16px; font-weight:700;
  background:var(--panel); color:var(--txt);
  border:2px solid var(--borde); border-radius:var(--radio); cursor:pointer;
}
.ficha:hover{ background:var(--panel-2); }
.ficha.usada{ visibility:hidden; }

/* Hueco en diálogo */
.dialogo-linea{ margin:0 0 10px; font-size:17px; }
.dialogo-linea .quien{ font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:.1em; color:var(--txt-3); display:block; }
.hueco{
  display:inline-block; min-width:100px; border-bottom:3px solid var(--acento);
  font-weight:800; color:var(--acento); text-align:center; padding:0 6px;
}

/* Feedback */
.feedback{
  border:2px solid var(--borde-suave); border-radius:var(--radio);
  padding:12px; margin:0 0 12px; font-size:16px;
}
.feedback .titulo{ font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.feedback.ok{ background:var(--ok-fondo); border-color:var(--ok-borde); }
.feedback.ok .titulo{ color:var(--ok); }
.feedback.mal{ background:var(--mal-fondo); border-color:var(--mal-borde); }
.feedback.mal .titulo{ color:var(--mal); }

/* ---- Simulacro ---- */
.chat{ display:flex; flex-direction:column; gap:10px; margin:0 0 14px; }
.burbuja{
  max-width:88%; padding:10px 12px; border:2px solid var(--borde);
  border-radius:var(--radio); font-size:17px;
}
.burbuja .pron{ display:block; font-size:14px; font-weight:700; color:var(--acento); margin-top:4px; }
.burbuja .trad{ display:block; font-size:14px; color:var(--txt-2); margin-top:2px; }
.burbuja.ellos{ align-self:flex-start; background:var(--panel); }
.burbuja.vos{ align-self:flex-end; background:var(--acento); color:var(--acento-txt); border-color:var(--acento); }
.burbuja.vos .pron{ color:var(--acento-txt); opacity:.9; }
.burbuja.vos .trad{ color:var(--acento-txt); opacity:.85; }
.burbuja.nota{ align-self:center; max-width:100%; background:var(--alerta-fondo); border-color:var(--alerta); font-size:15px; }
.escena{
  background:var(--panel-2); border-left:4px solid var(--mta-violeta);
  padding:10px 12px; margin:0 0 14px; font-size:15px; color:var(--txt-2);
}

/* ---- Datos culturales ---- */
.dato{
  background:var(--dato-fondo); border:2px solid var(--dato);
  border-radius:var(--radio); padding:12px; margin:0 0 12px; font-size:16px;
}
.dato .t{ font-weight:800; color:var(--dato); display:flex; gap:8px; align-items:center; margin-bottom:4px; }

/* ---- Buscador ---- */
.buscador-caja{ position:sticky; top:0; background:var(--fondo); padding:0 0 10px; z-index:5; }
input[type="search"], input[type="text"]{
  width:100%; min-height:50px; padding:10px 12px;
  font:inherit; font-size:17px;
  background:var(--panel); color:var(--txt);
  border:3px solid var(--borde); border-radius:var(--radio);
}
.resultado{
  background:var(--panel); border:2px solid var(--borde-suave); border-radius:var(--radio);
  padding:10px 12px; margin:0 0 8px;
}
.resultado .en{ font-size:18px; font-weight:800; }
.resultado .pr{ font-size:14px; font-weight:700; color:var(--acento); }
.resultado .es{ font-size:15px; color:var(--txt-2); }
.resultado .de{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--txt-3); margin-top:4px; }
.resultado-fila{ display:flex; gap:10px; align-items:flex-start; }
.resultado-fila .txt{ flex:1; min-width:0; }
mark{ background:var(--mta-amarillo); color:#0a0a0a; padding:0 2px; }

/* ---- Emergencia ---- */
.vista-sos{ }
.sos-cabecera{
  background:var(--emergencia); color:var(--emergencia-txt);
  border:3px solid var(--emergencia); border-radius:var(--radio);
  padding:14px; margin:0 0 14px;
}
.sos-cabecera h2{ margin:0 0 6px; font-size:24px; }
.sos-911{ font-size:54px; font-weight:800; line-height:1; letter-spacing:-.03em; }
.sos-frase{
  background:var(--panel); border:2px solid var(--borde);
  border-left:8px solid var(--emergencia);
  border-radius:var(--radio); padding:12px; margin:0 0 10px;
}
.sos-frase .en{ font-size:22px; font-weight:800; line-height:1.15; }
.sos-frase .pr{ font-size:16px; font-weight:700; color:var(--acento); margin:4px 0; }
.sos-frase .es{ font-size:15px; color:var(--txt-2); }

/* ---- Pie de navegación fijo ---- */
.pie{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--barra); border-top:4px solid var(--mta-amarillo);
  padding:6px 8px; padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
.pie-int{ max-width:var(--ancho); margin:0 auto; display:flex; gap:8px; }
.pie .btn{ flex:1; }

/* ---- Modal ---- */
.velo{
  position:fixed; inset:0; background:var(--velo); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal{
  background:var(--panel); border:3px solid var(--borde); border-radius:var(--radio);
  padding:16px; max-width:420px; width:100%;
}

/* ---- Varios ---- */
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
.chip{
  font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
  padding:6px 10px; border:2px solid var(--borde-suave); border-radius:var(--radio);
  background:var(--panel-2); color:var(--txt-2);
}
.chip.viva{ background:var(--mta-amarillo); color:#0a0a0a; border-color:#0a0a0a; }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.franja{
  height:8px; display:flex; margin:0 0 14px; border:2px solid var(--borde); border-radius:var(--radio); overflow:hidden;
}
.franja > i{ flex:1; }
</style>
</head>
<body>
<div id="app">
  <header class="barra">
    <span class="disco chico" id="barraDisco" style="background:var(--mta-verde)" aria-hidden="true">14</span>
    <h1 id="barraTitulo">Ma Nueva Yol</h1>
    <button class="barra-btn" id="btnBuscar" type="button" aria-label="Buscar frases">
      <svg class="ico" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.8" y1="12.8" x2="17.5" y2="17.5"/></svg>
    </button>
    <button class="barra-btn sos" id="btnSOS" type="button" aria-label="Modo emergencia">
      <span class="ico" aria-hidden="true">&#9888;</span> SOS
    </button>
  </header>

  <main id="main" tabindex="-1">
    <section class="vista" id="vInicio" aria-labelledby="tInicio"></section>
    <section class="vista" id="vDia" hidden aria-labelledby="tDia"></section>
    <section class="vista" id="vBuscar" hidden aria-label="Buscador de frases"></section>
    <section class="vista vista-sos" id="vSOS" hidden aria-label="Modo emergencia"></section>
  </main>

  <nav class="pie" id="pie" aria-label="Navegación principal">
    <div class="pie-int" id="pieInt"></div>
  </nav>
</div>
<div id="modales" aria-live="polite"></div>
<div id="avisos" class="sr" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ============================================================================
   CURSO — TODO el contenido vive acá. Para agregar o sacar frases tocá
   únicamente esta constante: la lógica no sabe nada del contenido.
   Cada frase: { en, pron, es, uso }
   Cada día:   { dia, titulo, linea, color, intro, frases, datos, dialogo }
   ========================================================================= */
const CURSO = [
{
  dia:1, titulo:"Cortesía y supervivencia", linea:"1", color:"--mta-rojo",

/* ============================================================================
   UTILIDADES
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const AVISOS = $("avisos");
function avisar(t){ if(AVISOS){ AVISOS.textContent = ""; setTimeout(()=>{ AVISOS.textContent = t; }, 30); } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizar(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function idFrase(f){ return normalizar(f.en).replace(/ /g,"-"); }
function mezclar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function hoyISO(d){ const x = d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function diasEntre(a,b){ // a, b en ISO
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  const da = Date.UTC(pa[0],pa[1]-1,pa[2]), db = Date.UTC(pb[0],pb[1]-1,pb[2]);
  return Math.round((db-da)/86400000);
}

/* Índice global de frases (curso + emergencia) */
const TODAS = [];
CURSO.forEach(d => (d.frases||[]).forEach(f => TODAS.push({ f, dia:d.dia, tituloDia:d.titulo, color:d.color, linea:d.linea })));
SOS.forEach(f => { if(!TODAS.some(x => idFrase(x.f)===idFrase(f))) TODAS.push({ f, dia:0, tituloDia:"Emergencias", color:"--emergencia", linea:"!" }); });
const POR_ID = {};
TODAS.forEach(x => { POR_ID[idFrase(x.f)] = x; });

/* ============================================================================
   ESTADO Y PERSISTENCIA — todo envuelto en try/catch: si localStorage falla,
   la app sigue funcionando en memoria.
   ========================================================================= */
const CLAVE = "manuevayol.v1";
let almacenamientoOk = true;
const estadoInicial = () => ({ dia:1, frases:{}, racha:0, ultima:null, hechos:[], lento:false });
let E = estadoInicial();

function cargar(){
  try{
    const crudo = window.localStorage.getItem(CLAVE);
    if(crudo){
      const p = JSON.parse(crudo);
      if(p && typeof p === "object"){
        E = Object.assign(estadoInicial(), p);
        if(typeof E.frases !== "object" || !E.frases) E.frases = {};
        if(!Array.isArray(E.hechos)) E.hechos = [];
        E.dia = Math.min(Math.max(1, Number(E.dia)||1), CURSO.length);
      }
    }
  }catch(err){ almacenamientoOk = false; }
}
function guardar(){
  try{ window.localStorage.setItem(CLAVE, JSON.stringify(E)); }
  catch(err){ almacenamientoOk = false; }
}
function borrarTodo(){
  try{ window.localStorage.removeItem(CLAVE); }catch(err){ almacenamientoOk = false; }
  E = estadoInicial();
}

/* ---- Leitner de 5 cajas ---- */
const ESPERA = [0, 1, 2, 4, 8]; // días de espera según la caja (1 a 5)
function estadoFrase(id){
  const e = E.frases[id];
  if(e && typeof e.caja === "number") return e;
  return { caja:0, prox:null };
}
function registrar(id, acerto){
  const e = estadoFrase(id);
  const caja = acerto ? Math.min(5, Math.max(1, e.caja + 1)) : 1;
  const prox = hoyISO(new Date(Date.now() + ESPERA[caja-1]*86400000));
  E.frases[id] = { caja, prox };
  guardar();
}
function vencida(id){
  const e = estadoFrase(id);
  if(e.caja === 0) return false;
  if(e.caja >= 5) return false;
  if(!e.prox) return true;
  return diasEntre(e.prox, hoyISO()) >= 0;
}
function vencidas(){
  return Object.keys(E.frases).filter(id => vencida(id) && POR_ID[id]);
}
function dominadas(){
  return Object.keys(E.frases).filter(id => estadoFrase(id).caja >= 4 && POR_ID[id]).length;
}
function porcentaje(){
  const tot = TODAS.length;
  return tot ? Math.round(dominadas()*100/tot) : 0;
}

/* ---- Racha ---- */
function marcarSesion(){
  const hoy = hoyISO();
  if(E.ultima === hoy){ /* ya contada */ }
  else if(E.ultima && diasEntre(E.ultima, hoy) === 1){ E.racha = (E.racha||0) + 1; }
  else { E.racha = 1; }
  E.ultima = hoy;
  guardar();
}

/* ============================================================================
   AUDIO — Web Speech API. Si no hay voces en inglés, se esconde todo lo de
   audio en lugar de romperse.
   ========================================================================= */
const Audio_ = {
  ok:false, voz:null, listo:false,
  buscarVoz(){
    if(!("speechSynthesis" in window)) return false;
    let vs = [];
    try{ vs = window.speechSynthesis.getVoices() || []; }catch(err){ return false; }
    if(!vs.length) return false;
    this.voz = vs.find(v => /^en[-_]US/i.test(v.lang))
            || vs.find(v => /^en/i.test(v.lang))
            || null;
    return !!this.voz;
  },
  iniciar(alCambiar){
    if(!("speechSynthesis" in window)){ this.listo = true; alCambiar(); return; }
    const probar = () => {
      const antes = this.ok;
      this.ok = this.buscarVoz();
      if(this.ok !== antes || !this.listo){ this.listo = true; alCambiar(); }
    };
    probar();
    try{ window.speechSynthesis.onvoiceschanged = probar; }catch(err){}
    setTimeout(probar, 400);
    setTimeout(() => { this.listo = true; probar(); }, 1600);
  },
  decir(texto){
    if(!this.ok) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      if(this.voz){ u.voice = this.voz; u.lang = this.voz.lang; } else { u.lang = "en-US"; }
      u.rate = E.lento ? 0.6 : 0.92;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    }catch(err){}
  }
};
function botonAudio(texto, clase){
  if(!Audio_.ok) return "";
  return '<button type="button" class="btn-audio '+(clase||"")+'" data-decir="'+esc(texto)+'">'
       + '<span aria-hidden="true">&#9654;</span> Escuchar</button>';
}
function botonVelocidad(){
  if(!Audio_.ok) return "";
  return '<button type="button" class="btn-audio mini" id="btnVel" aria-pressed="'+(E.lento?"true":"false")+'"'
       + ' aria-label="Velocidad de la voz: '+(E.lento?"lenta":"normal")+'. Tocá para cambiar.">'
       + (E.lento ? "Voz lenta" : "Voz normal") + '</button>';
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-decir]");
  if(b){ Audio_.decir(b.getAttribute("data-decir")); return; }
  if(ev.target.closest("#btnVel")){
    E.lento = !E.lento; guardar();
    document.querySelectorAll("#btnVel").forEach(x => {
      x.textContent = E.lento ? "Voz lenta" : "Voz normal";
      x.setAttribute("aria-pressed", E.lento ? "true" : "false");
      x.setAttribute("aria-label", "Velocidad de la voz: " + (E.lento?"lenta":"normal") + ". Tocá para cambiar.");
    });
    avisar(E.lento ? "Velocidad lenta" : "Velocidad normal");
  }
});

const VISTAS = { inicio:$("vInicio"), dia:$("vDia"), buscar:$("vBuscar"), sos:$("vSOS") };
let vistaActual = "inicio";
let vistaPrevia = "inicio";

function ir(nombre, opts){
  opts = opts || {};
  if(nombre !== vistaActual && nombre !== "sos" && nombre !== "buscar") vistaPrevia = nombre;
  else if(nombre === "sos" || nombre === "buscar"){ if(vistaActual !== "sos" && vistaActual !== "buscar") vistaPrevia = vistaActual; }
  vistaActual = nombre;
  Object.keys(VISTAS).forEach(k => { VISTAS[k].hidden = (k !== nombre); });
  if(nombre === "inicio") pintarInicio();
  if(nombre === "dia") pintarDia();
  if(nombre === "buscar") pintarBuscar();
  if(nombre === "sos") pintarSOS();
  pintarBarra();
  pintarPie();
  if(!opts.sinScroll) window.scrollTo(0,0);
  const m = $("main"); if(m && !opts.sinFoco) m.focus();
}

function pintarBarra(){
  const disco = $("barraDisco"), tit = $("barraTitulo");

/* ============================================================================
   PANTALLA DE INICIO
   ========================================================================= */
function frasesDelDia(d){
  if(d.frases && d.frases.length) return d.frases;
  // Día de repaso: junta frases de los días indicados, priorizando las vencidas.
  const pool = [];
  (d.repaso||[]).forEach(n => {
    const dd = CURSO.find(x => x.dia === n);
    if(dd) (dd.frases||[]).forEach(f => pool.push(f));
  });
  const venc = pool.filter(f => vencida(idFrase(f)));
  const resto = mezclar(pool.filter(f => !vencida(idFrase(f))));
  const sel = venc.concat(resto).slice(0, 12);
  return sel.length ? sel : pool.slice(0, 12);
}

    + '<i style="background:var(--mta-azul)"></i><i style="background:var(--mta-violeta)"></i>'

    + '<div class="metrica"><div class="n">'+dia+'</div><div class="r">Día de hoy</div></div>'
    + '<div class="metrica"><div class="n">'+(E.racha||0)+'</div><div class="r">Días seguidos</div></div>'

  if(pend > 0){
    html += '<div class="dato"><div class="t"><span aria-hidden="true">&#8635;</span> Repaso pendiente</div>'
          + 'Tenés <strong>'+pend+'</strong> '+(pend===1?"frase que se venció":"frases que se vencieron")+' de días anteriores. Arrancan solas al empezar el día.</div>';

  html += '<button type="button" class="btn primario grande" id="btnEmpezar">Empezar el día '+dia+'</button>'

      + '<span class="disco chico'+(claro?" sobre-claro":"")+'" style="background:var('+x.color+')" aria-hidden="true">'+esc(x.linea)+'</span>'
      + '<span class="txt"><span class="t">Día '+x.dia+' · '+esc(x.titulo)+'</span>'
      + '<span class="s">'+((x.frases&&x.frases.length)? x.frases.length+" frases nuevas" : "Repaso, sin contenido nuevo")+'</span></span>'
      + '<span class="est'+(listo?" listo":"")+'">'+(listo?"Hecho":(x.dia===dia?"Hoy":""))+'</span>'
      + '</button></li>';
  });
  html += '</ul>';

  html += '<div class="panel plano" style="margin-top:18px">'
    + '<h3>Ajustes</h3>'
    + (Audio_.ok
        ? '<p class="apagado" style="font-size:15px">Velocidad del audio: <strong>'+(E.lento?"lento":"normal")+'</strong></p><div class="audio-fila">'+botonVelocidad()+botonAudio("Excuse me, how much is it?","mini")+'</div>'
        : '<p class="apagado" style="font-size:15px">Este navegador no tiene voces en inglés disponibles, así que los botones de audio y los ejercicios de escuchar están desactivados. Todo lo demás funciona igual.</p>')
    + (almacenamientoOk ? "" : '<p class="apagado" style="font-size:15px"><strong>Ojo:</strong> este navegador no deja guardar el progreso. Podés usar la app igual, pero al cerrar se pierde lo avanzado.</p>')
    + '<button type="button" class="btn bloque" id="btnReiniciar">Reiniciar progreso</button>'
  + '</div>';

  VISTAS.inicio.innerHTML = html;
  $("btnEmpezar").addEventListener("click", () => abrirDia(E.dia));
  VISTAS.inicio.querySelectorAll("[data-dia]").forEach(b => {
    b.addEventListener("click", () => abrirDia(Number(b.getAttribute("data-dia"))));

function confirmarReinicio(){
  const cont = $("modales");
  cont.innerHTML = '<div class="velo" id="velo"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTit">'
    + '<h3 id="mTit">¿Reiniciar todo el progreso?</h3>'
    + '<p>Se borran el día en el que vas, la racha y el estado de todas las frases. No se puede deshacer.</p>'
    + '<div class="fila-btns"><button type="button" class="btn" id="mNo">No, volver</button>'
    + '<button type="button" class="btn primario" id="mSi">Sí, reiniciar</button></div></div></div>';
  const cerrar = () => { cont.innerHTML = ""; const b = $("btnReiniciar"); if(b) b.focus(); };
  $("mNo").addEventListener("click", cerrar);
  $("mSi").addEventListener("click", () => { borrarTodo(); cerrar(); ir("inicio"); avisar("Progreso reiniciado"); });
  $("velo").addEventListener("click", (ev) => { if(ev.target.id === "velo") cerrar(); });
  document.addEventListener("keydown", function escKey(ev){
    if(ev.key === "Escape"){ cerrar(); document.removeEventListener("keydown", escKey); }
  });
  $("mSi").focus();
}

/* ============================================================================
   EL DÍA — tres etapas: Aprender, Practicar, Usar
   ========================================================================= */
let sesion = null;

function abrirDia(n){
  const d = CURSO.find(x => x.dia === n);
  if(!d) return;
  const propias = frasesDelDia(d);
  const idsPropias = propias.map(idFrase);
  const repasoIds = vencidas().filter(id => idsPropias.indexOf(id) < 0).slice(0, 6);
  sesion = {
    dato: d,
    frases: propias,
    repaso: repasoIds.map(id => POR_ID[id].f),
    etapa: 0,
    indice: -1,
    ejercicios: null,
    ejIndice: 0,
    aciertos: 0,
    dlgTurno: 0,
    dlgHistorial: [],
    dlgFallos: 0
  };
  ir("dia");
}

function pintarDia(){
  if(!sesion){ ir("inicio"); return; }
  if(sesion.etapa === 0) etapaAprender();
  else if(sesion.etapa === 1) etapaPracticar();
  else etapaUsar();
}

function cabeceraPasos(){
  const e = sesion.etapa;
  const p = (i, txt) => '<div class="paso'+(i<e?" hecho":"")+'"'+(i===e?' aria-current="step"':'')+'>'+(i<e?"&#10003; ":"")+txt+'</div>';
  return '<div class="pasos" role="group" aria-label="Etapas del día">'+p(0,"Aprender")+p(1,"Practicar")+p(2,"Usar")+'</div>';
}

/* ---------- Etapa 1: APRENDER ---------- */
function etapaAprender(){
  const d = sesion.dato;
  const total = sesion.frases.length;
  const i = sesion.indice;

  if(i < 0){
    // Portada del día
    let html = cabeceraPasos()
      + '<p class="kicker">Día '+d.dia+(d.repaso?" · Repaso":"")+'</p>'
      + '<h2 id="tDia">'+esc(d.titulo)+'</h2>'
      + '<p>'+esc(d.intro)+'</p>';
    if(sesion.repaso.length){
      html += '<div class="dato"><div class="t"><span aria-hidden="true">&#8635;</span> Primero, el repaso</div>'
            + 'Antes de lo nuevo vas a ver '+sesion.repaso.length+' '+(sesion.repaso.length===1?"frase":"frases")+' de días anteriores que se te vencieron.</div>';
    }
    html += '<button type="button" class="btn primario grande" data-paso="arranque">Arrancar</button>';
    VISTAS.dia.innerHTML = html;
    VISTAS.dia.querySelector('[data-paso="arranque"]').addEventListener("click", () => { sesion.indice = 0; pintarDia(); });
    return;
  }

  if(i >= total){
    let html = cabeceraPasos() + '<h2 id="tDia">Listo el repaso de hoy</h2>'
      + '<p>Viste las '+total+' frases del día. Ahora se practican: si te equivocás no pasa nada, la frase vuelve a la primera caja y la vas a ver de nuevo.</p>';
    (d.datos||[]).forEach(x => {
      html += '<div class="dato"><div class="t"><span aria-hidden="true">&#9432;</span> '+esc(x.t)+'</div>'+esc(x.d)+'</div>';
    });
    html += '<div class="fila-btns"><button type="button" class="btn" data-paso="atras">Volver a ver</button>'
          + '<button type="button" class="btn primario" data-paso="practicar">Practicar</button></div>';
    VISTAS.dia.innerHTML = html;
    VISTAS.dia.querySelector('[data-paso="atras"]').addEventListener("click", () => { sesion.indice = 0; pintarDia(); });
    VISTAS.dia.querySelector('[data-paso="practicar"]').addEventListener("click", () => { sesion.etapa = 1; pintarDia(); });
    return;
  }

  const f = sesion.frases[i];
  const esRepaso = sesion.repaso.indexOf(f) >= 0;
  let html = cabeceraPasos()
    + '<p class="contador">Frase '+(i+1)+' de '+total+(esRepaso?" · repaso":"")+'</p>'
    + '<div class="panel">'
      + '<p class="frase-en" id="tDia">'+esc(f.en)+'</p>'
      + '<p class="frase-pron">'+esc(f.pron)+'</p>'
      + '<div class="audio-fila">'+botonAudio(f.en)+botonVelocidad()+'</div>'
      + '<p class="frase-es">'+esc(f.es)+'</p>'
      + '<p class="frase-uso">'+esc(f.uso)+'</p>'
    + '</div>'
    + '<div class="fila-btns">'
      + '<button type="button" class="btn" data-paso="prev"'+(i===0?" disabled":"")+'>Anterior</button>'
      + '<button type="button" class="btn primario" data-paso="next">'+(i===total-1?"Terminar":"Siguiente")+'</button>'
    + '</div>';
  VISTAS.dia.innerHTML = html;
  VISTAS.dia.querySelector('[data-paso="prev"]').addEventListener("click", () => { sesion.indice--; pintarDia(); });
  VISTAS.dia.querySelector('[data-paso="next"]').addEventListener("click", () => { sesion.indice++; pintarDia(); });
  if(Audio_.ok) Audio_.decir(f.en);
}

/* ---------- Etapa 2: PRACTICAR ---------- */
function distractores(correcta, campo, n){
  const pool = TODAS.map(x => x.f).filter(f => f[campo] && f[campo] !== correcta[campo]);
  const mismoDia = sesion.frases.filter(f => f !== correcta);
  const orden = mezclar(mismoDia).concat(mezclar(pool));
  const out = [];
  orden.forEach(f => {
    if(out.length >= n) return;
    if(f[campo] === correcta[campo]) return;
    if(out.some(o => o[campo] === f[campo])) return;
    out.push(f);
  });
  return out;
}

function armarEjercicios(){
  const d = sesion.dato;
  const base = sesion.repaso.concat(sesion.frases.filter(f => sesion.repaso.indexOf(f) < 0));
  const tipos = ["enEs","esEn","armar"];
  if(Audio_.ok) tipos.push("escucha");
  const ejs = [];

  base.forEach((f, k) => {
    const t = tipos[(k + Math.floor(Math.random()*tipos.length)) % tipos.length];
    ejs.push(construir(t, f));
  });

  // Huecos de diálogo: se arman con los turnos del diálogo del día.
  const turnos = (d.dialogo && d.dialogo.turnos) ? d.dialogo.turnos.filter(t => t.opciones && t.opciones.length >= 3) : [];
  mezclar(turnos).slice(0, 2).forEach(t => ejs.push(construirHueco(d, t)));

  return mezclar(ejs.filter(Boolean)).slice(0, 16);
}

function construir(tipo, f){
  if(tipo === "enEs"){
    const otras = distractores(f, "es", 3);
    if(otras.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"¿Qué quiere decir esta frase?", muestra:f.en, pron:f.pron,
             opciones: mezclar([{txt:f.es, ok:true}].concat(otras.map(o => ({txt:o.es, ok:false})))) };
  }
  if(tipo === "esEn"){
    const otras = distractores(f, "en", 3);
    if(otras.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"¿Cómo se dice esto en inglés?", muestra:f.es,
             opciones: mezclar([{txt:f.en, ok:true, pron:f.pron}].concat(otras.map(o => ({txt:o.en, ok:false, pron:o.pron})))) };
  }
  if(tipo === "escucha"){
    const otras = distractores(f, "en", 3);
    if(otras.length < 3) return construir("armar", f);
    return { tipo, f, enunciado:"Escuchá y elegí qué se dijo", muestra:null,
             opciones: mezclar([{txt:f.en, ok:true, pron:f.pron}].concat(otras.map(o => ({txt:o.en, ok:false, pron:o.pron})))) };
  }
  // armar
  const palabras = f.en.split(/\s+/).filter(Boolean);
  if(palabras.length < 2 || palabras.length > 9) return construir("enEs", f);
  return { tipo:"armar", f, enunciado:"Ordená las palabras para decir esto:", muestra:f.es, banco:mezclar(palabras.map((p,i)=>({p,i}))) };
}

function construirHueco(d, turno){
  const correcta = turno.opciones.find(o => o.ok) || turno.opciones[0];
  const f = { en:correcta.en, pron:correcta.pron, es:correcta.es, uso:"" };
  return { tipo:"hueco", f, personaje:d.dialogo.personaje, dice:turno.ellos,
           enunciado:"Completá lo que te toca decir a vos:",
           opciones: mezclar(turno.opciones.map(o => ({ txt:o.en, ok:!!o.ok, pron:o.pron, es:o.es, por:o.reaccion }))) };
}

function etapaPracticar(){

      cuerpo += '<button type="button" class="opcion" data-op="'+k+'"><span class="marca" aria-hidden="true">'+String.fromCharCode(65+k)+'</span><span>'+esc(o.txt)+'</span></button>';
    });

      + '<button type="button" class="btn primario" id="btnComprobar" disabled>Comprobar</button></div>';

      + (ej.dice.es ? '<p class="apagado" style="font-size:15px;margin:0 0 10px">'+esc(ej.dice.es)+'</p>' : "")

function montarArmado(ej){
  const armado = $("armado"), banco = $("banco");
  const btnC = $("btnComprobar"), btnL = $("btnLimpiar");
  let puestas = [];
  function pintar(){
    armado.innerHTML = puestas.length
      ? puestas.map((w,k) => '<button type="button" class="ficha" data-quitar="'+k+'">'+esc(w.p)+'</button>').join("")
      : '<span class="apagado" style="padding:8px">Tocá las palabras de abajo en orden.</span>';
    banco.innerHTML = ej.banco.map((w,k) => '<button type="button" class="ficha'+(puestas.indexOf(w)>=0?" usada":"")+'" data-poner="'+k+'"'+(puestas.indexOf(w)>=0?' tabindex="-1" aria-hidden="true"':'')+'>'+esc(w.p)+'</button>').join("");
    btnC.disabled = puestas.length !== ej.banco.length;
    armado.querySelectorAll("[data-quitar]").forEach(b => b.addEventListener("click", () => {
      puestas.splice(Number(b.getAttribute("data-quitar")),1); pintar();
    }));
    banco.querySelectorAll("[data-poner]").forEach(b => b.addEventListener("click", () => {
      const w = ej.banco[Number(b.getAttribute("data-poner"))];
      if(puestas.indexOf(w) < 0){ puestas.push(w); pintar(); }
    }));
  }
  pintar();
  btnL.addEventListener("click", () => { puestas = []; pintar(); });
  btnC.addEventListener("click", () => {
    const dicho = puestas.map(w => w.p).join(" ");
    responder(ej, null, dicho);
  });
}

function responder(ej, indice, textoArmado){
  const zona = $("zonaFeedback");
  let acerto, explic;

  if(ej.tipo === "armar"){
    acerto = normalizar(textoArmado) === normalizar(ej.f.en);
    explic = acerto
      ? 'Así se dice: <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'.'
      : 'El orden correcto es <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'. Vos pusiste: '+esc(textoArmado)+'.';
    document.querySelectorAll("#btnComprobar,#btnLimpiar,#banco .ficha,#armado .ficha").forEach(b => b.disabled = true);
  } else {
    const op = ej.opciones[indice];
    acerto = !!op.ok;
    const correcta = ej.opciones.find(o => o.ok);
    VISTAS.dia.querySelectorAll("[data-op]").forEach(b => {
      const k = Number(b.getAttribute("data-op"));
      b.disabled = true;
      if(ej.opciones[k].ok) b.classList.add("ok");
      else if(k === indice) b.classList.add("mal");
      else b.classList.add("tenue");
    });
    if(ej.tipo === "hueco"){
      explic = acerto
        ? esc(op.por || "")
        : (op.por ? esc(op.por)+' La que iba es <strong>'+esc(correcta.txt)+'</strong> ('+esc(correcta.es)+').'
                  : 'La que iba es <strong>'+esc(correcta.txt)+'</strong> ('+esc(correcta.es)+').');
    } else if(acerto){
      explic = '<strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'. '+esc(ej.f.uso||"");
    } else if(ej.tipo === "enEs"){
      const otra = TODAS.find(x => x.f.es === op.txt);
      explic = '<strong>'+esc(ej.f.en)+'</strong> quiere decir '+esc(ej.f.es)+'.'
             + (otra ? ' Lo que elegiste es lo que quiere decir <strong>'+esc(otra.f.en)+'</strong>.' : '');
    } else {
      const otra = TODAS.find(x => x.f.en === op.txt);
      explic = 'Se dice <strong>'+esc(ej.f.en)+'</strong> — '+esc(ej.f.pron)+'.'
             + (otra ? ' Lo que elegiste, '+esc(otra.f.en)+', quiere decir '+esc(otra.f.es)+'.' : '')
             + ' ' + esc(ej.f.uso||"");
    }
  }

  if(POR_ID[idFrase(ej.f)]) registrar(idFrase(ej.f), acerto);
  if(acerto) sesion.aciertos++;

  zona.innerHTML = '<div class="feedback '+(acerto?"ok":"mal")+'">'
    + '<div class="titulo"><span aria-hidden="true">'+(acerto?"&#10003;":"&#10007;")+'</span> '+(acerto?"Bien":"No era esa")+'</div>'
    + '<div>'+explic+'</div></div>'
    + (Audio_.ok ? '<div class="audio-fila">'+botonAudio(ej.f.en)+botonVelocidad()+'</div>' : "")
    + '<button type="button" class="btn primario bloque" id="btnSeguir">Seguir</button>';
  avisar((acerto?"Correcto. ":"Incorrecto. ") + (ej.f.en));
  $("btnSeguir").addEventListener("click", () => { sesion.ejIndice++; pintarDia(); });
  $("btnSeguir").focus();
}

function etapaUsar(){
  const d = sesion.dato, dlg = d.dialogo;
  const t = sesion.dlgTurno;

  let html = cabeceraPasos();

  if(t === 0 && !sesion.dlgHistorial.length){
    html += '<p class="kicker">Simulacro</p><h2 id="tDia">'+esc(dlg.personaje)+'</h2>'
      + '<div class="escena">'+esc(dlg.escena)+'</div>'
      + '<p>Vas a tener que elegir qué contestar en cada turno. Si elegís mal, mirá cómo reacciona y probá de nuevo: nadie te está tomando examen.</p>'
      + '<button type="button" class="btn primario grande" id="btnArrancaDlg">Empezar la conversación</button>';
    VISTAS.dia.innerHTML = html;
    $("btnArrancaDlg").addEventListener("click", () => { sesion.dlgHistorial = [{tipo:"inicio"}]; pintarDia(); });
    return;
  }

  if(t >= dlg.turnos.length){
    terminarDia();
    return;
  }

  const turno = dlg.turnos[t];
  html += '<p class="contador">Turno '+(t+1)+' de '+dlg.turnos.length+' · '+esc(dlg.personaje)+'</p>'
        + '<div class="escena">'+esc(dlg.escena)+'</div>'
        + '<div class="chat" id="chat">';

  sesion.dlgHistorial.forEach(h => {
    if(h.tipo === "ellos"){
      html += '<div class="burbuja ellos">'+esc(h.en)+(h.pron?'<span class="pron">'+esc(h.pron)+'</span>':"")+(h.es?'<span class="trad">'+esc(h.es)+'</span>':"")+'</div>';
    } else if(h.tipo === "vos"){
      html += '<div class="burbuja vos">'+esc(h.en)+(h.pron?'<span class="pron">'+esc(h.pron)+'</span>':"")+(h.es?'<span class="trad">'+esc(h.es)+'</span>':"")+'</div>';
    } else if(h.tipo === "nota"){
      html += '<div class="burbuja nota">'+esc(h.txt)+'</div>';
    }
  });

  html += '<div class="burbuja ellos" id="turnoActual">'+esc(turno.ellos.en)
        + (turno.ellos.pron?'<span class="pron">'+esc(turno.ellos.pron)+'</span>':"")
        + (turno.ellos.es?'<span class="trad">'+esc(turno.ellos.es)+'</span>':"")
        + '</div></div>';

  if(turno.nota){ html += '<div class="dato"><div class="t"><span aria-hidden="true">&#9432;</span> Ojo</div>'+esc(turno.nota)+'</div>'; }
  if(Audio_.ok && /[a-z]/i.test(turno.ellos.en)){
    html += '<div class="audio-fila">'+botonAudio(turno.ellos.en.replace(/\(.*?\)/g,"").trim() || turno.ellos.en)+botonVelocidad()+'</div>';
  }

  html += '<h3 id="tDia">¿Qué contestás?</h3><div class="opciones" role="group" aria-label="Qué contestás">';
  turno.opciones.forEach((o, k) => {
    html += '<button type="button" class="opcion" data-dlg="'+k+'"><span class="marca" aria-hidden="true">'+String.fromCharCode(65+k)+'</span>'
      + '<span>'+esc(o.en)+'<br><small class="apagado">'+esc(o.pron)+' · '+esc(o.es)+'</small></span></button>';
  });
  html += '</div><div id="zonaFeedback"></div>';

  VISTAS.dia.innerHTML = html;
  VISTAS.dia.querySelectorAll("[data-dlg]").forEach(b => {
    b.addEventListener("click", () => responderDialogo(turno, Number(b.getAttribute("data-dlg"))));
  });
  if(Audio_.ok && /[a-z]/i.test(turno.ellos.en)) Audio_.decir(turno.ellos.en.replace(/\(.*?\)/g,"").trim() || turno.ellos.en);
}

function responderDialogo(turno, k){
  const o = turno.opciones[k];
  const zona = $("zonaFeedback");
  VISTAS.dia.querySelectorAll("[data-dlg]").forEach(b => {
    const j = Number(b.getAttribute("data-dlg"));
    b.disabled = true;
    if(j === k) b.classList.add(o.ok ? "ok" : "mal");
    else b.classList.add("tenue");
  });

  if(POR_ID[idFrase({en:o.en})]) registrar(idFrase({en:o.en}), !!o.ok);

  zona.innerHTML = '<div class="feedback '+(o.ok?"ok":"mal")+'">'
    + '<div class="titulo"><span aria-hidden="true">'+(o.ok?"&#10003;":"&#10007;")+'</span> '+(o.ok?"Funcionó":"Salió mal")+'</div>'
    + '<div>'+esc(o.reaccion)+'</div></div>'
    + (Audio_.ok ? '<div class="audio-fila">'+botonAudio(o.en)+botonVelocidad()+'</div>' : "")
    + (o.ok
        ? '<button type="button" class="btn primario bloque" id="btnSeguirDlg">Seguir</button>'
        : '<button type="button" class="btn primario bloque" id="btnReintentar">Probar otra vez</button>');
  avisar(o.ok ? "Correcto" : "Incorrecto");

  if(o.ok){
    $("btnSeguirDlg").addEventListener("click", () => {
      sesion.dlgHistorial.push({ tipo:"ellos", en:turno.ellos.en, pron:turno.ellos.pron, es:turno.ellos.es });
      sesion.dlgHistorial.push({ tipo:"vos", en:o.en, pron:o.pron, es:o.es });
      sesion.dlgTurno++;
      pintarDia();
    });
    $("btnSeguirDlg").focus();
  } else {
    sesion.dlgFallos++;
    $("btnReintentar").addEventListener("click", () => pintarDia());
    $("btnReintentar").focus();
  }
}

function terminarDia(){
  const d = sesion.dato;
  if(E.hechos.indexOf(d.dia) < 0) E.hechos.push(d.dia);
  if(E.dia === d.dia && d.dia < CURSO.length) E.dia = d.dia + 1;
  marcarSesion();
  guardar();

  const quedan = CURSO.length - E.hechos.length;
  VISTAS.dia.innerHTML = '<p class="kicker">Día '+d.dia+' terminado</p>'
    + '<h2 id="tDia">Lo hiciste entero</h2>'
    + '<div class="franja" aria-hidden="true"><i style="background:var(--mta-verde)"></i><i style="background:var(--mta-verde)"></i><i style="background:var(--mta-amarillo)"></i></div>'
    + '<p>Cerraste la conversación con '+esc(d.dialogo.personaje).toLowerCase()+'. '

    + '<div class="metricas">'

      + '<div class="metrica"><div class="n">'+quedan+'</div><div class="r">Días por hacer</div></div>'

   BUSCADOR — en español o en inglés, sin tildes ni mayúsculas, en vivo

function pintarBuscar(){
  if(VISTAS.buscar.dataset.listo === "1"){ const i = $("q"); if(i) i.focus(); return; }
  VISTAS.buscar.innerHTML = '<p class="kicker">Buscador</p>'
    + '<h2>Buscá cualquier frase</h2>'
    + '<div class="buscador-caja">'
      + '<label class="sr" for="q">Buscar una frase en español o en inglés</label>'
      + '<input type="search" id="q" placeholder="cuánto cuesta, check, baño, subte…" autocomplete="off" autocorrect="off" spellcheck="false">'
    + '</div>'
    + '<div id="resultados" aria-live="polite"></div>';
  VISTAS.buscar.dataset.listo = "1";
  const inp = $("q");
  inp.addEventListener("input", () => buscar(inp.value));
  buscar("");
  inp.focus();

function resaltar(txt, q){
  if(!q) return esc(txt);
  const n = normalizar(txt), nq = normalizar(q);
  const p = n.indexOf(nq);
  if(p < 0 || !nq) return esc(txt);
  // Mapea la posición del texto normalizado al original contando caracteres útiles.
  let vistos = 0, ini = -1, fin = -1;
  for(let i = 0; i < txt.length; i++){
    const c = normalizar(txt[i]);
    if(ini < 0 && vistos === p && c) ini = i;
    if(c) vistos += c.length;
    if(ini >= 0 && vistos >= p + nq.length){ fin = i + 1; break; }
  }
  if(ini < 0) return esc(txt);
  if(fin < 0) fin = txt.length;
  return esc(txt.slice(0,ini)) + "<mark>" + esc(txt.slice(ini,fin)) + "</mark>" + esc(txt.slice(fin));
}

function buscar(q){
  const cont = $("resultados");
  const nq = normalizar(q);
  let lista = TODAS;
  if(nq){
    lista = TODAS.filter(x => normalizar(x.f.en).indexOf(nq) >= 0
                           || normalizar(x.f.es).indexOf(nq) >= 0
                           || normalizar(x.f.pron).indexOf(nq) >= 0
                           || normalizar(x.f.uso||"").indexOf(nq) >= 0);
    lista = lista.slice().sort((a,b) => {
      const pa = Math.min(...[normalizar(a.f.en).indexOf(nq), normalizar(a.f.es).indexOf(nq)].filter(v=>v>=0).concat([99]));
      const pb = Math.min(...[normalizar(b.f.en).indexOf(nq), normalizar(b.f.es).indexOf(nq)].filter(v=>v>=0).concat([99]));
      return pa - pb;
    });
  }
  if(!lista.length){
    cont.innerHTML = '<div class="panel plano"><p style="margin:0">No hay ninguna frase con <strong>'+esc(q)+'</strong>. Probá con una palabra más corta: <em>cuenta</em>, <em>baño</em>, <em>train</em>.</p></div>';
    return;
  }
  const tope = lista.slice(0, 60);
  cont.innerHTML = '<p class="contador" style="margin-bottom:8px">'+lista.length+' '+(lista.length===1?"frase":"frases")+(nq?"":" en total")+'</p>'
    + tope.map(x => {
      const claro = (x.color === "--mta-amarillo" || x.color === "--mta-gris");
      return '<div class="resultado"><div class="resultado-fila">'
        + '<span class="disco chico'+(claro?" sobre-claro":"")+'" style="background:var('+x.color+')" aria-hidden="true">'+esc(x.linea)+'</span>'
        + '<span class="txt">'
          + '<span class="en">'+resaltar(x.f.en, q)+'</span><br>'
          + '<span class="pr">'+resaltar(x.f.pron, q)+'</span><br>'
          + '<span class="es">'+resaltar(x.f.es, q)+'</span>'
          + '<span class="de">'+(x.dia ? "Día "+x.dia+" · "+esc(x.tituloDia) : "Emergencia")+'</span>'
        + '</span>'
        + (Audio_.ok ? '<span>'+botonAudio(x.f.en, "mini")+'</span>' : "")
      + '</div></div>';
    }).join("")
    + (lista.length > tope.length ? '<p class="apagado">Se muestran las primeras '+tope.length+'. Escribí algo más para afinar.</p>' : "");
}

/* ============================================================================
   MODO EMERGENCIA — de un solo toque desde cualquier pantalla
   ========================================================================= */
function pintarSOS(){
  VISTAS.sos.innerHTML = '<div class="sos-cabecera">'
    + '<h2>Emergencia</h2>'
    + '<p style="margin:0 0 4px">Policía, bomberos y ambulancia. Gratis desde cualquier teléfono, aunque no tengas chip ni saldo.</p>'
    + '<div class="sos-911">911</div>'
    + '<p style="margin:6px 0 0"><strong>Se dice:</strong> nine one one (náin uán UÁN)</p>'
  + '</div>'
  + '<div class="dato"><div class="t"><span aria-hidden="true">&#9873;</span> Pedí intérprete en español</div>'
    + 'Apenas atiendan, decí <strong>Spanish, please</strong> (SPÁ-nish pliis) o <strong>I need an interpreter in Spanish</strong>. '
    + 'Es gratis, es tu derecho y tardan menos de un minuto en poner a alguien en la línea. No cortes: quedate en el teléfono hasta que te lo digan.</div>'
  + '<h3>Frases para decir ya</h3>'
  + SOS.map(f =>
      '<div class="sos-frase">'
      + '<div class="en">'+esc(f.en)+'</div>'
      + '<div class="pr">'+esc(f.pron)+'</div>'
      + '<div class="es">'+esc(f.es)+'</div>'
      + (Audio_.ok ? '<div class="audio-fila" style="margin:8px 0 0">'+botonAudio(f.en,"mini")+'</div>' : "")
      + '<p class="frase-uso" style="margin-top:8px">'+esc(f.uso)+'</p>'
      + '</div>').join("")
  + '<div class="panel plano"><h3>Antes de que pase algo</h3>'
    + '<p style="margin:0">Tené a mano, en el teléfono y en papel: tu alergia y tu medicación escritas en inglés, el teléfono del consulado argentino en Nueva York, una foto del pasaporte y el número de tu seguro de viaje. '
    + 'El hospital para urgencias se llama <strong>emergency room</strong> (ER).</p></div>'
  + '<button type="button" class="btn bloque" data-ir="inicio">Volver</button>';
}

/* ============================================================================
   ARRANQUE
   ========================================================================= */
function refrescarPorAudio(){
  if(vistaActual === "buscar"){ const i = $("q"); buscar(i ? i.value : ""); }
  else if(vistaActual === "inicio") pintarInicio();
  else if(vistaActual === "sos") pintarSOS();
}

document.addEventListener("keydown", (ev) => {
  if(ev.key === "Escape" && (vistaActual === "buscar" || vistaActual === "sos")) ir(vistaPrevia || "inicio");
});

cargar();
// Si pasó más de un día sin entrar, la racha se corta.
if(E.ultima && diasEntre(E.ultima, hoyISO()) > 1){ E.racha = 0; guardar(); }
Audio_.iniciar(refrescarPorAudio);
ir("inicio", { sinFoco:true });
</script>
